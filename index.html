<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<!--
  VISUAL DNA — daveWorld · "Laboratorium Angka" (arsitipe: laboratorium holografik — dipakai sesuai arahan wajib, tidak diganti)
  1. Konsep & dunia: laboratorium holografik di puncak Menara Kristal; dunia disusun dari manipulatif matematika (kubus satuan, batang puluhan, kotak sepuluh, kristal angka) yang melayang sebagai hologram. Petualangan = mendaki menara menuju fajar.
  2. Hierarki warna: navy-laut = ruang; biru langit (--sky-*) = "sistem" (HUD, garis, soal, angka pertama); oranye (--ora-*) = "aksi & hadiah" (CTA, jawaban, bintang, angka kedua). Mint hanya untuk benar, koral hanya untuk salah.
  3. Tipografi: Space Grotesk (judul, angka, label — geometris & tegas) + DM Sans (isi & instruksi — ramah dibaca anak). Teks tidak pernah di bawah 18px.
  4. Bahasa bentuk: geometri tegas campuran (lingkaran, segi enam, segitiga, trapesium) dengan ukuran berbeda; radius kecil; garis tepi 1px bercahaya tipis; tanpa rotate/skew pada elemen interaktif & teks.
  5. Ilustrasi: SVG/CSS berlapis (langit fajar → siluet menara → grid lantai hologram → manipulatif melayang → karakter). Maskot Dabo (robot penjelajah berwarna putih-biru, syal oranye), mesin hitung Kalku, Kabut Glitch sebagai lawan.
  6. Animasi & tekstur: cepat dan responsif (140–300ms) dengan pegas pendek; denyut hanya di CTA & pintu aktif; garis pindai tipis di layar hologram; semua patuh prefers-reduced-motion.
-->
<!--
  Catatan materi: "berhitung angka 1-20" menjadi pijakan (Tahap 1–2 pada tangga belajar); tangga lalu naik ke puluhan, menyimpan, dan berujung di 99 + 99 sesuai capaian belajar.
  Variation check: bila gaya/tema diganti, yang ikut berubah = latar, komposisi, bentuk pilihan jawaban, dan metafora (papan penunjuk, mesin berkarakter, lorong pintu, jurnal). Mekanik & alur game tetap.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04122a">
<meta name="description" content="daveWorld — game edukasi penjumlahan: mendaki Menara Kristal, dari satuan sampai 99 + 99.">
<title>daveWorld Petualangan Angka</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2304122a'/%3E%3Cpath d='M32 8l18 12v24L32 56 14 44V20z' fill='%234cc3ff'/%3E%3Cpath d='M32 8l18 12-18 12-18-12z' fill='%23ffa43d'/%3E%3C/svg%3E">
<!-- Font Google (Space Grotesk + DM Sans) dimuat lewat skrip di bagian bawah agar halaman tidak tertahan bila jaringan lambat/terblokir -->
<style>
/* =====================================================================
   0. TOKEN — semua keputusan visual terpusat di sini
   ===================================================================== */
:root{
  /* warna: navy-laut (ruang), biru langit (sistem), oranye (aksi & hadiah) */
  --ink-950:#030d1f; --ink-900:#04122a; --ink-800:#071b3a; --ink-700:#0b2a52; --ink-600:#123a6e; --ink-500:#1b4d8f;
  --sky-200:#c4ebff; --sky-300:#8fd8ff; --sky-400:#4cc3ff; --sky-500:#1fa7f5; --sky-600:#0b84d6;
  --ora-200:#ffdcb0; --ora-300:#ffc27a; --ora-400:#ffa43d; --ora-500:#ff8a1f; --ora-600:#e56d00;
  --mint:#3df0b0; --coral:#ff6178; --gold:#ffd166;
  --text:#eaf6ff; --text-dim:#b3cdea; --text-ink:#04122a;
  --line:rgba(76,195,255,.55); --line-soft:rgba(76,195,255,.26);
  --panel:linear-gradient(180deg,rgba(9,36,74,.82),rgba(4,18,42,.90));
  --glow-sky:0 0 14px rgba(76,195,255,.38); --glow-ora:0 0 16px rgba(255,138,31,.5);
  /* bentuk */
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --hex:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);
  --trap:polygon(14% 0,86% 0,100% 100%,0 100%);
  --tri:polygon(50% 2%,98% 96%,2% 96%);
  /* tipografi */
  --f-display:'Space Grotesk',system-ui,'Segoe UI',Roboto,sans-serif;
  --f-body:'DM Sans',system-ui,'Segoe UI',Roboto,sans-serif;
  /* gerak */
  --t-fast:140ms; --t-mid:260ms;
  --ease-out:cubic-bezier(.2,.9,.25,1); --ease-spring:cubic-bezier(.3,1.55,.5,1);
  /* skena */
  --hz:64%;                                   /* garis cakrawala latar */
  --u:clamp(70px,min(23vw,12.5vh),112px);     /* satuan ukuran bola jawaban */
  --safe-top:env(safe-area-inset-top,0px);     /* versi Artifact: 0px (kerangka sudah memberi padding) */
  --safe-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;                          /* satu dunia visual: gelap */
}

/* =====================================================================
   1. RESET & DASAR
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{height:100%;font-size:18px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* layar besar & tinggi (monitor 1080p+, proyektor kelas): ukuran dasar ikut membesar agar nyaman dibaca dari jauh */
@media (min-width:1400px) and (min-height:900px){
  html{font-size:clamp(18px,1.95vh,26px)}
  :root{--u:clamp(70px,min(23vw,12.5vh),6.2rem)}
}
body{margin:0;height:100%;background:var(--ink-900);color:var(--text);font:400 1rem/1.45 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p,ul,ol,figure{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
svg{display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ora-400);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:1.35em;height:1.35em;flex:none;fill:currentColor}

/* =====================================================================
   2. LATAR DUNIA (satu dunia, semua layar) — langit fajar, siluet menara, grid lantai
   ===================================================================== */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--ink-900);pointer-events:none}
#bg>*{position:absolute}
.bg-sky{inset:0;background:linear-gradient(180deg,#04122a 0%,#07264f 22%,#0d5aa8 42%,#35aaf0 calc(var(--hz) - 13%),#bfe7ff calc(var(--hz) - 5%),#ffd7a6 calc(var(--hz) - 1.6%),#ff9a3d var(--hz),#ff8a1f 100%)}
.bg-stars{left:0;right:0;top:0;height:calc(var(--hz) - 8%);width:100%}
.bg-stars svg,.bg-skyline svg,.bg-grid svg{width:100%;height:100%}
.bg-stars circle{fill:#fff;animation:twinkle 3.6s ease-in-out infinite}
.bg-grid line{vector-effect:non-scaling-stroke}
.bg-sun{left:50%;top:var(--hz);width:min(78vmin,560px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-64%);background:radial-gradient(circle,#fff4da 0,#ffd58f 20%,#ffa43d 46%,rgba(255,138,31,0) 70%);opacity:.92;transition:top .6s var(--ease-out)}
.bg-skyline{left:0;right:0;top:calc(var(--hz) - clamp(120px,26vw,320px));height:clamp(120px,26vw,320px);width:100%}
.bg-floor{left:0;right:0;bottom:0;top:var(--hz);background:linear-gradient(180deg,#0a2a55 0%,#071d3f 32%,#04122a 100%);box-shadow:0 -1px 0 rgba(191,231,255,.85),0 -2px 22px rgba(255,154,61,.65)}
.bg-grid{left:0;right:0;bottom:0;top:var(--hz);width:100%;height:calc(100% - var(--hz))}
.bg-float{inset:0}
.fl{position:absolute;width:var(--w,46px);opacity:var(--o,.7);animation:drift var(--d,7s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
.fl svg{width:100%;height:auto;filter:drop-shadow(0 0 8px rgba(76,195,255,.55))}
body[data-scene="welcome"]{--hz:54%}
body[data-scene="menu"]{--hz:56%}
body[data-scene="hitung"]{--hz:74%}
body[data-scene="result"]{--hz:68%}
body[data-scene="quest"],body[data-scene="room"]{--hz:70%}
body[data-scene="hitung"] #bg>.bg-float,body[data-scene="quest"] #bg>.bg-float,body[data-scene="room"] #bg>.bg-float{display:none}

/* =====================================================================
   3. KOMPONEN BERSAMA
   ===================================================================== */
#app{position:relative;z-index:1;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}
.screen.enter{animation:screenIn .34s var(--ease-out)}

/* pembungkus cahaya & garis tepi untuk bentuk clip-path */
.glow{display:inline-block;filter:drop-shadow(0 0 10px var(--gc,rgba(255,138,31,.55)))}
.g-sky{--gc:rgba(76,195,255,.55)}
.outline{display:inline-block;filter:drop-shadow(1px 0 0 var(--oc,var(--sky-400))) drop-shadow(-1px 0 0 var(--oc,var(--sky-400))) drop-shadow(0 1px 0 var(--oc,var(--sky-400))) drop-shadow(0 -1px 0 var(--oc,var(--sky-400))) drop-shadow(0 0 12px rgba(76,195,255,.22))}

/* panel hologram (semi-transparan, garis 1px, siku bertanda) */
.holo{--bk:var(--sky-400);position:relative;border:1px solid var(--line-soft);border-radius:var(--r-md);
  background:
    linear-gradient(var(--bk),var(--bk)) top left/16px 1px no-repeat,
    linear-gradient(var(--bk),var(--bk)) top left/1px 16px no-repeat,
    linear-gradient(var(--bk),var(--bk)) top right/16px 1px no-repeat,
    linear-gradient(var(--bk),var(--bk)) top right/1px 16px no-repeat,
    linear-gradient(var(--bk),var(--bk)) bottom left/16px 1px no-repeat,
    linear-gradient(var(--bk),var(--bk)) bottom left/1px 16px no-repeat,
    linear-gradient(var(--bk),var(--bk)) bottom right/16px 1px no-repeat,
    linear-gradient(var(--bk),var(--bk)) bottom right/1px 16px no-repeat,
    var(--panel);
  box-shadow:0 0 0 1px rgba(76,195,255,.05) inset,0 12px 30px rgba(0,0,0,.35),0 0 22px rgba(76,195,255,.12)}

/* tombol utama: segi enam memanjang, oranye */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:52px;padding:.7rem 1.8rem;font:700 1.15rem/1.1 var(--f-display);letter-spacing:.02em;color:var(--text-ink);background:linear-gradient(180deg,var(--ora-300) 0%,var(--ora-500) 100%);
  clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,18px 100%,0 50%);transition:transform var(--t-fast) var(--ease-spring),filter var(--t-fast)}
.btn:hover{filter:brightness(1.09)}
.btn:active{transform:scale(.95)}
.btn:focus-visible{outline:none;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--sky-600)}
.btn--sky{background:linear-gradient(180deg,var(--sky-200) 0%,var(--sky-400) 100%)}
.btn:disabled{filter:grayscale(.8) brightness(.7);transform:none}

/* tombol bayangan (kembali, dll.) */
.btn-ghost{display:inline-flex;align-items:center;gap:.4rem;min-height:48px;padding:.5rem 1rem;border:1px solid var(--line);border-radius:var(--r-md);background:rgba(5,22,48,.62);color:var(--text);font:500 1rem/1.15 var(--f-body);transition:border-color var(--t-fast),box-shadow var(--t-fast),transform var(--t-fast)}
.btn-ghost:hover{border-color:var(--sky-300);box-shadow:var(--glow-sky)}
.btn-ghost:active{transform:scale(.97)}
.icon-btn{display:grid;place-items:center;flex:none;width:48px;height:48px;border:1px solid var(--line);border-radius:50%;background:rgba(5,22,48,.62);color:var(--sky-300);transition:border-color var(--t-fast),box-shadow var(--t-fast),transform var(--t-fast)}
.icon-btn:hover{border-color:var(--sky-300);box-shadow:var(--glow-sky)}
.icon-btn:active{transform:scale(.93)}
.icon-btn .ic{width:26px;height:26px}
.icon-btn[aria-pressed="false"]{color:var(--text-dim);opacity:.8}

/* label & pil */
.tag{display:inline-block;padding:.25rem 1.05rem;font:700 1rem/1.3 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--sky-200);background:rgba(76,195,255,.18);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%)}
.chip{display:inline-flex;align-items:center;gap:.4rem;min-height:36px;padding:.15rem 1rem;font:700 1rem/1.2 var(--f-display);letter-spacing:.03em;color:var(--sky-200);background:rgba(76,195,255,.16);clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%)}
.chip--ora{color:var(--ora-300);background:rgba(255,138,31,.18)}
.pill{display:inline-flex;align-items:center;gap:.4rem;min-height:40px;padding:.15rem 1.1rem;font:700 1.2rem/1 var(--f-display);color:var(--ora-300);background:rgba(255,138,31,.16);clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%)}
.pill .ic{color:var(--gold);width:1.1em;height:1.1em}

/* HUD atas layar permainan */
.hud{position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(10px,var(--safe-top)) 16px 6px}
.hud-row{position:relative;z-index:6;display:flex;align-items:center;gap:12px;width:min(100%,64rem);margin-inline:auto;padding:2px 16px 8px}

/* rel kemajuan (garis bilangan dengan simpul berlian) */
.rail{position:relative;flex:1;min-width:0;height:32px;display:flex;align-items:center}
.rail__track{position:absolute;left:7px;right:7px;top:50%;height:2px;background:rgba(143,216,255,.32);transform:translateY(-50%)}
.rail__fill{position:absolute;left:7px;top:50%;height:4px;width:0;background:linear-gradient(90deg,var(--sky-400),var(--ora-400));box-shadow:0 0 10px rgba(255,138,31,.55);transform:translateY(-50%);transition:width .4s var(--ease-out)}
.rail__dots{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%}
.rail__dot{width:14px;height:14px;background:#2a5a93;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transition:background var(--t-mid),transform var(--t-mid) var(--ease-spring)}
.rail__dot.is-done{background:var(--ora-400)}
.rail__dot.is-now{background:#fff;transform:scale(1.55)}
.rail__label{flex:none;min-width:3.4em;font:700 1.05rem/1 var(--f-display);color:var(--sky-200);white-space:nowrap}

/* ikon bintang kecil di pil skor */
.score-pop{display:inline-block}
.score-pop.bump{animation:bump .38s var(--ease-spring)}

/* toast singkat */
.toast{position:fixed;left:50%;top:max(118px,calc(var(--safe-top) + 104px));z-index:80;pointer-events:none;width:max-content;max-width:min(92vw,26rem);padding:.7rem 1.3rem;text-align:center;font:500 1.05rem/1.35 var(--f-body);color:var(--text);background:rgba(4,18,42,.94);border:1px solid var(--ora-400);border-radius:var(--r-md);box-shadow:var(--glow-ora);transform:translateX(-50%);animation:toastIn .3s var(--ease-spring);white-space:normal}

/* =====================================================================
   4. EFEK (bintang, poin melayang)
   ===================================================================== */
#fx{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.bstar{position:absolute;left:0;top:0;width:var(--sz,26px);height:var(--sz,26px);margin:calc(var(--sz,26px) / -2) 0 0 calc(var(--sz,26px) / -2);color:var(--c,var(--gold));animation:burst .8s cubic-bezier(.15,.8,.3,1) forwards}
.bstar svg{width:100%;height:100%;fill:currentColor;filter:drop-shadow(0 0 6px currentColor)}
.fpop{position:absolute;font:700 1.7rem/1 var(--f-display);color:var(--gold);text-shadow:0 0 14px rgba(255,209,102,.8);white-space:nowrap;animation:floatUp 1s var(--ease-out) forwards}
.fpop--bad{color:var(--coral);text-shadow:0 0 14px rgba(255,97,120,.7)}
.fring{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid var(--c,var(--mint));animation:ring .6s ease-out forwards}

/* =====================================================================
   5. ANIMASI BERSAMA
   ===================================================================== */
@keyframes screenIn{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes drift{from{transform:translateY(-9px)}to{transform:translateY(11px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@keyframes bulb{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes flutter{0%,100%{transform:translateX(0) scaleY(1)}50%{transform:translateX(4px) scaleY(.88)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes burst{0%{transform:translate(0,0) scale(.3);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
@keyframes floatUp{0%{transform:translateY(0) scale(.7);opacity:0}15%{opacity:1;transform:translateY(-8px) scale(1.1)}100%{transform:translateY(-70px) scale(1);opacity:0}}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(6);opacity:0}}
@keyframes shakeX{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}36%{transform:translateX(8px)}54%{transform:translateX(-6px)}72%{transform:translateX(4px)}}
@keyframes ctaPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 8px rgba(255,138,31,.5))}50%{transform:scale(1.05);filter:drop-shadow(0 0 24px rgba(255,138,31,.9))}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes qpulse{0%,100%{opacity:1}50%{opacity:.55}}
/* =====================================================================
   6. WELCOME — poster tipografis (judul penuh lebar, maskot menumpuk di atas huruf, CTA mengambang)
   ===================================================================== */
.topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(12px,var(--safe-top)) 16px 6px;position:relative;z-index:6}
.welcome{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);padding-bottom:max(18px,var(--safe-bottom))}
.w-rings-clip{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.w-rings{position:absolute;left:50%;top:40%;width:min(125vw,980px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;z-index:1}
.w-poster{position:relative;z-index:3;width:100%;align-self:center;display:flex;flex-direction:column;align-items:flex-end;padding:0 0 0}
.w-mascot{position:relative;z-index:4;width:clamp(120px,min(40vw,23vh),300px);margin:0 clamp(10px,17vw,260px) calc(-1 * min(10.4vw,150px)) 0;pointer-events:none}
.w-mascot .dabo{width:100%;height:auto;filter:drop-shadow(0 8px 14px rgba(3,13,31,.5))}
.w-title{position:relative;z-index:3;width:100%;line-height:0}
.w-title svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 20px rgba(76,195,255,.45)) drop-shadow(0 8px 22px rgba(4,18,42,.55))}
.w-title text{font-family:var(--f-display);font-weight:700}
.w-foot{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:-26px;padding:46px 16px 0;background:linear-gradient(180deg,rgba(4,18,42,0) 0,rgba(4,18,42,.84) 52px,rgba(4,18,42,.94) 100%)}
.w-tagline{max-width:30rem;text-align:center}
.w-tagline strong{display:block;font:700 clamp(1.45rem,6.2vw,2.1rem)/1.1 var(--f-display);color:#fff;text-shadow:0 0 18px rgba(76,195,255,.55),0 2px 10px rgba(4,18,42,.7)}
.w-tagline span{display:block;margin-top:.35rem;font-size:1.05rem;line-height:1.35;color:#e3f3ff;text-shadow:0 1px 8px rgba(4,18,42,.85)}
.w-act{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.w-pick{display:flex;align-items:flex-start;justify-content:center;gap:12px;width:100%}
.w-pick .outline{flex:0 1 auto}
.age{display:grid;align-content:center;justify-items:center;gap:0;width:min(43vw,170px);padding:.75rem 1.4rem;text-align:center;color:var(--sky-200);background:linear-gradient(180deg,rgba(11,42,82,.95),rgba(5,22,48,.95));transition:transform var(--t-mid) var(--ease-spring),background var(--t-fast)}
.age--hex{min-height:128px;clip-path:var(--hex)}
.age--trap{min-height:112px;margin-top:20px;padding-top:.9rem;clip-path:polygon(9% 0,91% 0,100% 100%,0 100%)}
.age__big{font:700 2rem/1 var(--f-display);letter-spacing:-.01em}
.age__small{font-size:1rem;line-height:1.25;color:var(--text-dim)}
.age:hover{transform:scale(1.04)}
.age:active{transform:scale(.97)}
.age[aria-checked="true"]{background:linear-gradient(180deg,var(--ora-300),var(--ora-500));color:var(--text-ink)}
.age[aria-checked="true"] .age__small{color:#3a1d00}
.outline:has(.age[aria-checked="true"]){--oc:var(--ora-300)}
.outline:has(.age:focus-visible){--oc:#fff}
.age:focus-visible{outline:none}
.w-pick.nudge .outline{animation:shakeX .5s}
.cta-wrap{display:inline-block;animation:ctaPulse 1.9s ease-in-out infinite}
.btn-cta{min-height:66px;max-width:calc(100vw - 24px);padding:.9rem clamp(1.05rem,4.6vw,2rem);font-size:clamp(1.15rem,5.4vw,1.5rem);letter-spacing:.04em;gap:.7rem;white-space:nowrap}
.btn-cta .ic{width:1.1em;height:1.1em}
.w-note{min-height:1.5em;font:500 1rem/1.3 var(--f-body);color:var(--ora-300);text-align:center}

/* =====================================================================
   7. MENU — papan penunjuk arah bercabang dari satu tiang
   ===================================================================== */
.menu{padding-bottom:max(14px,var(--safe-bottom))}
.m-world{position:relative;flex:1 1 auto;display:flex;flex-direction:column;gap:22px;min-height:500px;width:100%;max-width:1000px;margin:0 auto;padding:128px 0 40px}
.m-hillwrap{position:absolute;left:0;right:0;bottom:0;height:min(40vh,320px);z-index:0;pointer-events:none}
.m-hill{display:block;width:100%;height:100%}
.m-dests{position:absolute;left:0;right:0;bottom:0;height:min(40vh,320px);z-index:0;pointer-events:none}
.m-dest{position:absolute;bottom:62%;width:clamp(86px,24vw,170px)}
.m-dest svg{width:100%;height:auto;filter:drop-shadow(0 0 10px rgba(76,195,255,.4))}
.m-dest--a{left:max(2%,calc(50% - 560px))}
.m-dest--b{right:max(3%,calc(50% - 560px));width:clamp(70px,19vw,130px)}
.m-pole{position:absolute;left:50%;top:78px;bottom:0;width:20px;transform:translateX(-50%);z-index:1;background:linear-gradient(90deg,#08224a 0%,#2a64a8 36%,#a8e2ff 50%,#2a64a8 64%,#08224a 100%);box-shadow:0 0 0 1px rgba(143,216,255,.6),0 0 20px rgba(76,195,255,.4)}
.m-badge{position:absolute;left:50%;top:0;z-index:3;width:112px;height:112px;transform:translateX(-50%);display:grid;place-items:center;align-content:center;border-radius:50%;text-align:center;font:700 1.05rem/1.12 var(--f-display);letter-spacing:.02em;color:var(--text-ink);background:radial-gradient(circle at 50% 30%,#ffe2ad,var(--ora-400) 55%,var(--ora-600));box-shadow:0 0 26px rgba(255,138,31,.75),inset 0 0 0 2px rgba(255,255,255,.6)}
.m-badge small{display:block;font:500 1rem/1.1 var(--f-body);letter-spacing:0}
.sign{position:relative;z-index:2;display:block;text-align:left;transition:transform var(--t-mid) var(--ease-spring)}
.sign:hover{transform:translateY(-3px) scale(1.015)}
.sign:active{transform:scale(.985)}
.sign-a{align-self:flex-start;margin-left:2.5%;width:min(90%,490px);--oc:var(--sky-400)}
.sign-b{align-self:flex-end;margin-right:2.5%;width:min(80%,430px);--oc:var(--ora-400)}
.sign__shape{display:flex;align-items:center;gap:12px;padding:14px 18px 14px 48px;background:linear-gradient(180deg,rgba(12,46,90,.97),rgba(5,24,52,.97));clip-path:polygon(38px 0,100% 0,100% 100%,38px 100%,0 50%)}
.sign-b .sign__shape{padding:14px 48px 14px 16px;clip-path:polygon(0 0,calc(100% - 38px) 0,100% 50%,calc(100% - 38px) 100%,0 100%)}
.sign__icon{flex:none;width:64px;height:64px}
.sign__icon svg{width:100%;height:100%}
.sign__txt{flex:1;min-width:0}
.sign__txt strong{display:block;font:700 1.25rem/1.15 var(--f-display);color:#fff}
.sign__txt em{display:block;margin-top:3px;font:400 1rem/1.3 var(--f-body);font-style:normal;color:var(--text-dim)}
.sign__go{display:inline-flex;align-items:center;gap:.3rem;min-height:40px;margin-top:8px;padding:0 1rem;font:700 1rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--text-ink);background:var(--ora-400);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%)}
.sign-a .sign__go{background:var(--sky-300)}
.sign:focus-visible{outline:2px solid #fff;outline-offset:4px}

@media (max-width:859px){
  .m-world{padding-top:104px}

@media (min-width:640px) and (min-aspect-ratio:13/10) and (max-height:560px){

  /* menu: dua papan berdampingan di kiri-kanan tiang */
  .m-world{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-content:start;column-gap:36px;min-height:0;padding:72px 2% 0}

  .sign-b{grid-column:2;align-self:start;margin-top:30px;margin-left:-18px}

  .sign__txt strong{font-size:1.1rem}
  .sign__shape{gap:8px;padding:10px 12px 10px 40px}

/* =====================================================================
   8. KARAKTER (animasi ringan Dabo, Glitch)
   ===================================================================== */
.dabo{overflow:visible}
.dabo .d-all{animation:bob 2.6s ease-in-out infinite}
.dabo .d-eyes{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
.dabo .d-bulb{animation:bulb 1.6s ease-in-out infinite}
.dabo .d-tail{animation:flutter 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.dabo--cheer .d-all{animation:bob .55s ease-in-out infinite}
.walking .dabo .d-all{animation:bob .36s ease-in-out infinite}
.walking .dabo .d-leg{animation:step .36s ease-in-out infinite}
.walking .dabo .d-leg-r{animation-delay:.18s}
@keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.glitch{overflow:visible}
.glitch .g-all{animation:glitchBob 2.2s ease-in-out infinite}
.glitch .g-noise{animation:glitchNoise 1.4s steps(2,end) infinite}
.glitch .g-n2{animation-duration:1.9s;animation-delay:-.6s}
.glitch .g-pupil{animation:glitchLook 3.4s ease-in-out infinite}
@keyframes glitchBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes glitchNoise{0%{transform:translateX(0)}30%{transform:translateX(9px)}60%{transform:translateX(-7px)}100%{transform:translateX(0)}}
@keyframes glitchLook{0%,100%{transform:translateX(0)}40%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
.bub{animation:bubUp 4.6s linear infinite}
.bub.b2{animation-duration:5.6s;animation-delay:-2s}.bub.b3{animation-duration:6.4s;animation-delay:-3.4s}
@keyframes bubUp{from{transform:translateY(0);opacity:.7}to{transform:translateY(-110px);opacity:0}}

/* =====================================================================
   9. BERHITUNG & MATEMATIKA — Kalku (mesin hitung berkarakter), saluran, bola jawaban
   ===================================================================== */
.h-lab{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.9}
.h-lab svg{position:absolute;inset:0;width:100%;height:100%}
.h-stage{position:relative;z-index:2;flex:1 0 auto;display:flex;flex-direction:column;align-items:center;width:100%;max-width:max(1100px,62rem);margin:0 auto;padding:0 16px 14px}
.h-pipes{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.pipe-edge{fill:none;stroke:rgba(76,195,255,.6);stroke-width:19;stroke-linecap:round}
.pipe-body{fill:none;stroke:#0a2347;stroke-width:16;stroke-linecap:round}
.pipe-flow{fill:none;stroke:#8fd8ff;stroke-width:3;stroke-linecap:round;stroke-dasharray:2 16;animation:flow 1.1s linear infinite}
.pipe-edge,.pipe-body{stroke-dasharray:1 1;stroke-dashoffset:1;animation:pipeIn .5s var(--ease-out) forwards}
.h-stage.static-pipes .pipe-edge,.h-stage.static-pipes .pipe-body{animation:none;stroke-dashoffset:0}
@keyframes pipeIn{to{stroke-dashoffset:0}}

.kalku{position:relative;z-index:2;width:min(100%,540px);padding-top:30px}
.k-ant{position:absolute;top:0;left:0;right:0;height:34px;display:flex;justify-content:space-between;padding:0 24%}
.k-ant i{position:relative;display:block;width:3px;height:100%;background:var(--sky-400)}
.k-ant i::after{content:"";position:absolute;top:-8px;left:50%;width:15px;height:15px;margin-left:-7px;border-radius:50%;background:var(--ora-400);box-shadow:0 0 14px var(--ora-400);animation:bulb 1.4s ease-in-out infinite}
.k-ant i:last-child::after{animation-delay:-.7s;background:var(--sky-300);box-shadow:0 0 14px var(--sky-400)}
.k-shell{position:relative;display:block;width:100%;--oc:var(--sky-400)}
.k-shell::before,.k-shell::after{content:"";position:absolute;top:36%;width:14px;height:52px;border-radius:7px;background:linear-gradient(180deg,var(--ora-300),var(--ora-600))}
.k-shell::before{left:-9px}.k-shell::after{right:-9px}
.k-body{position:relative;display:grid;gap:10px;padding:12px 14px 14px;background:linear-gradient(180deg,#165091 0%,#0b2f5e 55%,#08254d 100%);clip-path:polygon(0 24px,24px 0,calc(100% - 24px) 0,100% 24px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px))}
.k-bezel{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 clamp(2px,2.4vw,18px)}
.k-eye{position:relative;flex:none;width:30px;height:30px;border-radius:50%;background:#031428;border:1px solid var(--sky-400);overflow:hidden}
.k-eye b{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;background:var(--sky-300);box-shadow:0 0 10px var(--sky-400);transform:translate(-50%,-50%);transition:all .2s var(--ease-spring)}
.kalku[data-mood="happy"] .k-eye b{height:7px;border-radius:14px 14px 0 0;transform:translate(-50%,-90%);background:var(--mint);box-shadow:0 0 10px var(--mint)}
.kalku[data-mood="sad"] .k-eye b{height:7px;border-radius:0 0 14px 14px;transform:translate(-50%,0);background:var(--coral);box-shadow:0 0 10px var(--coral)}
.k-tier{min-height:30px;font-size:1rem;padding:.1rem clamp(.5rem,2.4vw,.9rem);white-space:nowrap}
.k-screen{position:relative;display:grid;gap:8px;justify-items:center;text-align:center;padding:12px 12px 12px;border:1px solid var(--line);border-radius:8px;
  background:repeating-linear-gradient(180deg,rgba(76,195,255,.07) 0 1px,transparent 1px 4px),radial-gradient(120% 90% at 50% 0%,#0c3a6e 0%,#031428 72%);box-shadow:inset 0 0 26px rgba(76,195,255,.2)}
.k-story{max-width:34ch;font-size:1rem;line-height:1.35;color:var(--text)}
.k-expr{display:flex;flex-wrap:nowrap;justify-content:center;align-items:baseline;gap:.28em;font:700 clamp(2rem,calc((min(100vw,540px) - 72px) / 6.4),4rem)/1 var(--f-display);letter-spacing:-.02em;white-space:nowrap}
.k-expr .n{text-shadow:0 0 16px currentColor}
.k-expr .a{color:var(--sky-300)}
.k-expr .b{color:var(--ora-300)}
.k-expr .c{color:#fff}
.k-expr .op{color:var(--text-dim);font-weight:500}
.k-expr .q{color:#fff;animation:qpulse 1.6s ease-in-out infinite}
.k-expr .q.is-solved{animation:none;color:var(--mint)}
.k-expr .q.is-miss{animation:none;color:var(--mint)}
.k-aid{display:grid;place-items:center;width:100%;min-height:72px}
.aid-svg{height:72px;width:auto;max-width:100%}
.hint-btn{display:inline-flex;align-items:center;gap:.45rem;min-height:48px;padding:.35rem 1.2rem;font:700 1rem/1 var(--f-display);color:var(--ora-300);background:rgba(255,138,31,.14);border:1px solid rgba(255,164,61,.65);border-radius:24px;transition:background var(--t-fast),transform var(--t-fast) var(--ease-spring)}
.hint-btn:hover{background:rgba(255,138,31,.26)}.hint-btn:active{transform:scale(.95)}
.hint-btn .ic{width:1.15em;height:1.15em}
.hint-box{display:grid;justify-items:center;gap:6px;animation:screenIn .3s var(--ease-out)}
.hint-text{max-width:34ch;font-size:1rem;line-height:1.35;color:var(--text)}
.hl-t{color:var(--sky-300);font-weight:700}.hl-o{color:var(--ora-300);font-weight:700}
.k-mouth{display:flex;justify-content:space-around;align-items:flex-end;height:18px;padding:0 9%;margin-bottom:-4px}
.outlet{display:block;width:32px;height:13px;background:#02101f;border:1px solid var(--sky-400);border-radius:3px 3px 11px 11px;box-shadow:inset 0 -5px 7px rgba(255,138,31,.6)}

.h-orbs{position:relative;z-index:3;width:100%;flex:1 1 auto;min-height:calc(var(--u) * 2.35)}
.orb{position:absolute;left:var(--x);top:var(--y);width:calc(var(--u) * var(--s));height:calc(var(--u) * var(--s));transform:translate(-50%,-50%);padding:0;display:block}
.orb::after{content:"";position:absolute;inset:-8px}
.orb__body{position:absolute;inset:0;display:grid;place-items:center;filter:drop-shadow(0 6px 10px rgba(3,13,31,.5)) drop-shadow(0 0 12px var(--glow,rgba(76,195,255,.35)));transition:transform var(--t-fast) var(--ease-spring),filter var(--t-mid)}
.orb:hover .orb__body{transform:scale(1.08)}
.orb:active .orb__body{transform:scale(.94)}
.orb__svg{position:absolute;inset:0;width:100%;height:100%}
.orb__num{position:relative;font:700 max(18px,calc(var(--u) * var(--s) * var(--fs,.4)))/1 var(--f-display);color:var(--text-ink);text-shadow:0 1px 0 rgba(255,255,255,.4);letter-spacing:-.02em}
.orb--tri .orb__num{margin-top:22%}
.orb--trap .orb__num{margin-top:4%}
.orb:focus-visible{outline:none}
.orb:focus-visible .orb__body{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 14px var(--ora-400))}
.orb__mark{position:absolute;right:-2px;top:-4px;z-index:2;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--text-ink);animation:markIn .35s var(--ease-spring)}
.orb__mark .ic{width:20px;height:20px}
.orb.is-right .orb__mark,.orb.is-answer .orb__mark{background:var(--mint);box-shadow:0 0 14px var(--mint)}
.orb.is-wrong .orb__mark{background:var(--coral);box-shadow:0 0 14px var(--coral)}
.orb.is-right .orb__body,.orb.is-answer .orb__body{--glow:var(--mint);animation:orbRight .55s var(--ease-spring)}
.orb.is-wrong .orb__body{--glow:var(--coral);animation:shakeX .45s}
.orb.is-wrong .orb__svg{filter:saturate(.35) brightness(.8)}
.orb.is-dim{opacity:.42;pointer-events:none}
.h-orbs.leaving .orb__body{transition:transform .16s ease-in,opacity .16s ease-in;transform:scale(.25);opacity:0}
@keyframes orbRight{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1.06)}}
@keyframes markIn{from{transform:scale(0)}to{transform:scale(1)}}

@media (min-width:640px) and (min-aspect-ratio:13/10){
  .h-stage{flex-direction:row;align-items:center;justify-content:center;padding:0 28px 18px}
  .kalku{flex:none;width:min(54%,31rem)}
  .h-orbs{flex:1 1 auto;align-self:stretch;min-height:0;max-width:520px;margin:12px 0 0 64px}

  .k-story{font-size:1rem;line-height:1.28}

  .h-orbs{min-height:calc(var(--u) * 2.1)}
}

@media (min-width:640px) and (min-aspect-ratio:13/10) and (max-height:560px){
  :root{--u:clamp(62px,19vh,92px)}
  .h-stage{padding-bottom:8px}
  .kalku{padding-top:22px;width:min(56%,520px)}
  .k-ant{height:26px}
  .k-body{gap:6px;padding:8px 12px 10px}
  .k-screen{gap:4px;padding:8px 10px}
  .k-story{line-height:1.25}
  .k-expr{font-size:clamp(1.8rem,8vh,3rem)}
  .k-aid{min-height:46px}.aid-svg{height:46px}
  .h-orbs{margin:6px 0 0 36px}
  .hud{padding-top:6px;padding-bottom:2px}.hud-row{padding-bottom:2px}

/* =====================================================================
   10. ADVENTURE QUEST — lorong panjang: pintu kiri-kanan bergantian, jalur menaik
   ===================================================================== */
.quest{overflow:hidden}
.q-scroll{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.q-scroll::-webkit-scrollbar{display:none}
.corridor{position:relative;width:100%;max-width:640px;margin:0 auto;background:linear-gradient(0deg,#04122a 0%,#07264f 16%,#0d5aa8 44%,#35aaf0 68%,#bfe7ff 86%,#ffd7a6 94%,#ff9a3d 100%);overflow:hidden}
.q-wall{position:absolute;top:0;bottom:0;width:13%;background:repeating-linear-gradient(180deg,rgba(76,195,255,.28) 0 3px,transparent 3px 54px),linear-gradient(90deg,#03112a,#0a2a55)}
.q-wall.l{left:0;border-right:1px solid var(--line)}
.q-wall.r{right:0;border-left:1px solid var(--line);background:repeating-linear-gradient(180deg,rgba(255,164,61,.26) 0 3px,transparent 3px 54px),linear-gradient(270deg,#03112a,#0a2a55)}
.q-floor{position:absolute;left:13%;right:13%;top:0;bottom:0;background:repeating-linear-gradient(180deg,rgba(191,231,255,.10) 0 1px,transparent 1px 42px),linear-gradient(90deg,rgba(4,18,42,.34),rgba(4,18,42,0) 22%,rgba(4,18,42,0) 78%,rgba(4,18,42,.34))}
.q-path{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.q-seg{fill:none;stroke:rgba(191,231,255,.5);stroke-width:5;stroke-dasharray:2 11;stroke-linecap:round;vector-effect:non-scaling-stroke}
.q-seg.is-done{stroke:var(--ora-400);stroke-width:7;stroke-dasharray:none;filter:drop-shadow(0 0 7px rgba(255,138,31,.85))}

.pad{position:absolute;left:var(--x);top:var(--y);width:clamp(66px,19vw,86px);height:30px;transform:translate(-50%,-50%);z-index:2;background:linear-gradient(180deg,#2f6bb0,#0e3a73);clip-path:polygon(18% 0,82% 0,100% 50%,82% 100%,18% 100%,0 50%);transition:background .4s}
.pad.is-open{background:linear-gradient(180deg,var(--ora-300),var(--ora-600));animation:padPulse 1.7s ease-in-out infinite}
.pad.is-done{background:linear-gradient(180deg,var(--sky-300),var(--sky-600))}
.pad--start{width:clamp(90px,26vw,120px);height:38px;background:linear-gradient(180deg,#46a2ee,#16508f)}

.door{position:absolute;left:var(--x);top:var(--y);z-index:3;width:clamp(88px,25vw,120px);transform:translate(-50%,-100%);padding:0;text-align:center}
.door__art{position:relative;display:block;transition:transform var(--t-mid) var(--ease-spring),filter var(--t-mid)}
.door:hover .door__art{transform:translateY(-3px)}
.door__svg{width:100%;height:auto;overflow:visible}
.dr-frame{fill:#0b2a52;stroke:#2f6bb0;stroke-width:3;transition:stroke .3s,fill .3s}
.dr-void{fill:#03112a}
.dr-light{opacity:0;transition:opacity .5s}
.dr-leaf{fill:#14345f;stroke:#3a74b8;stroke-width:1.5;transition:transform .7s var(--ease-out),fill .3s}
.dr-seam{stroke:#02102a;stroke-width:2}
.dr-lock{transition:opacity .3s}
.door__num{position:absolute;left:50%;top:-14px;z-index:2;display:grid;place-items:center;width:38px;height:42px;transform:translateX(-50%);font:700 1.15rem/1 var(--f-display);color:var(--sky-200);background:#0e3a73;clip-path:var(--hex)}
.door__plaque{display:inline-block;margin-top:8px;padding:.12rem .75rem;font:700 1rem/1.2 var(--f-display);color:var(--text);background:rgba(4,18,42,.86);clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%);white-space:nowrap}
.door{display:flex;flex-direction:column}
.door.side-l{align-items:flex-start}
.door.side-r{align-items:flex-end}
.door__art{width:100%}
.door__stars{position:absolute;left:0;right:0;top:46%;display:flex;justify-content:center;gap:2px;opacity:0;transition:opacity .5s .3s}
.door__stars .ic{width:22px;height:22px;color:var(--gold);filter:drop-shadow(0 0 5px rgba(255,209,102,.9))}
.door__stars .ic.off{color:#3d5c8a;filter:none}
.door__go{position:absolute;left:0;right:0;top:-58px;z-index:3;display:none;width:max-content;margin:0 auto;padding:.15rem .9rem;font:700 1rem/1.3 var(--f-display);color:var(--text-ink);background:var(--ora-400);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);white-space:nowrap;animation:bob 1.2s ease-in-out infinite}
/* terkunci */
.door.is-locked .door__art{filter:saturate(.55) brightness(.78)}
.door.is-locked .door__plaque{opacity:.6}
.door.is-locked .door__num{background:#143a6c;color:#7fa6d4}
/* terbuka (pintu aktif): menyala oranye, berdenyut */
.door.is-open .dr-frame{stroke:var(--ora-400);fill:#3a2208}
.door.is-open .dr-leaf{fill:url(#gOra);stroke:#ffd9a6}
.door.is-open .dr-leaf-l{transform:translateX(-5px)}
.door.is-open .dr-leaf-r{transform:translateX(5px)}
.door.is-open .dr-light{opacity:1;animation:doorGlow 1.6s ease-in-out infinite}
.door.is-open .dr-lock{opacity:0}
.door.is-open .door__art{filter:drop-shadow(0 0 14px rgba(255,138,31,.85))}
.door.is-open .door__num{background:var(--ora-400);color:var(--text-ink)}
.door.is-open .door__go{display:block}
/* selesai */
.door.is-done .dr-frame{stroke:var(--sky-300);fill:#0b3a6e}
.door.is-done .dr-leaf{fill:#14447f;stroke:#8fd8ff}
.door.is-done .dr-leaf-l{transform:translateX(-31px)}
.door.is-done .dr-leaf-r{transform:translateX(31px)}
.door.is-done .dr-light{opacity:.9}
.door.is-done .dr-lock{opacity:0}
.door.is-done .door__num{background:var(--sky-400);color:var(--text-ink)}
.door.is-done .door__stars{opacity:1}
/* animasi membuka saat dimasuki */
.door.opening .dr-leaf-l{transform:translateX(-32px)}
.door.opening .dr-leaf-r{transform:translateX(32px)}
.door.opening .dr-light{opacity:1;animation:none;transform-origin:50% 66%;transform:scale(1.6);transition:transform .5s,opacity .5s}
.door.shake .door__art{animation:shakeX .45s}
.door:focus-visible{outline:none}
.door:focus-visible .door__art{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 12px var(--ora-400))}

.q-avatar{position:absolute;left:var(--x);top:var(--y);z-index:4;width:clamp(56px,16vw,74px);transform:translate(-50%,-88%);pointer-events:none}
.q-avatar .dabo{width:100%;height:auto;filter:drop-shadow(0 6px 8px rgba(3,13,31,.55))}
.q-avatar.flip .dabo{transform:scaleX(-1)}
.q-zone{position:absolute;left:50%;top:var(--y);z-index:2;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:0;min-width:150px;padding:.3rem 1.3rem;font:700 1rem/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;text-align:center;color:var(--sky-200);background:rgba(4,18,42,.86);clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);white-space:nowrap}
.q-zone b{color:var(--ora-300)}
.q-core{position:absolute;left:50%;top:var(--y);z-index:2;width:clamp(180px,52vw,260px);transform:translate(-50%,-50%)}
.q-core svg{width:100%;height:auto;overflow:visible}
.sock{fill:#0e3a73;stroke:#4cc3ff;stroke-width:2;transition:fill .5s,filter .5s}
.sock.is-lit{fill:var(--ora-400);stroke:#fff;filter:drop-shadow(0 0 8px rgba(255,138,31,.9))}
.core-crystal{transition:opacity .6s,filter .6s;opacity:.45;filter:grayscale(.7)}
.core-crystal.is-whole{opacity:1;filter:drop-shadow(0 0 16px rgba(255,138,31,.85))}
.q-tip{pointer-events:none;position:absolute;left:50%;bottom:max(18px,var(--safe-bottom));z-index:7;max-width:min(90vw,22rem);padding:.55rem 1.3rem;text-align:center;font:700 1.05rem/1.3 var(--f-display);color:var(--text-ink);background:var(--ora-400);clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%);transform:translateX(-50%);animation:toastIn .35s var(--ease-spring);filter:drop-shadow(0 0 12px rgba(255,138,31,.7))}
.q-flash{position:fixed;inset:0;z-index:65;background:radial-gradient(circle at 50% 55%,#fff3d6 0,#ffb35c 40%,#ff8a1f 100%);animation:flashIn .55s ease-in forwards}
@keyframes padPulse{0%,100%{filter:drop-shadow(0 0 6px rgba(255,138,31,.6))}50%{filter:drop-shadow(0 0 16px rgba(255,138,31,1))}}
@keyframes doorGlow{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes flashIn{from{opacity:0}to{opacity:1}}

/* =====================================================================
   11. RUANG TANTANGAN — arena (Dabo vs Glitch), kartu soal, roda sandi, bar jembatan, timbangan, urutan
   ===================================================================== */
.room{overflow-y:auto}
.r-bg{position:absolute;inset:0;z-index:0;pointer-events:none;background:var(--rbg,linear-gradient(180deg,#06204a,#0d5aa8 60%,#35aaf0))}
.r-bg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,rgba(4,18,42,0),rgba(4,18,42,.86)),repeating-linear-gradient(90deg,rgba(76,195,255,.18) 0 1px,transparent 1px 48px)}
.room[data-zone="0"]{--rbg:linear-gradient(180deg,#05204a 0%,#0d5aa8 55%,#4cb8f5 100%)}
.room[data-zone="1"]{--rbg:linear-gradient(180deg,#062a44 0%,#0b6f9a 55%,#6fd0e8 100%)}
.room[data-zone="2"]{--rbg:linear-gradient(180deg,#0a2250 0%,#2a5fb3 52%,#ffb066 100%)}
.room[data-zone="3"]{--rbg:linear-gradient(180deg,#0b2d66 0%,#3a8fe0 52%,#d6efff 100%)}
.room[data-zone="4"]{--rbg:linear-gradient(180deg,#03102a 0%,#0b2e63 50%,#e0701a 100%)}
.r-energy{display:flex;align-items:center;gap:4px;padding:2px 6px}
.r-energy .ic{width:34px;height:34px;color:var(--ora-400);filter:drop-shadow(0 0 7px rgba(255,138,31,.8));transition:color .3s,opacity .3s}
.r-energy .ic.lost{color:#4a6a9a;filter:none;opacity:.5}
.r-arena{position:relative;z-index:2;flex:1 0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr;gap:10px;width:100%;max-width:860px;margin:0 auto;padding:0 16px 16px}
.r-battle{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:8px 10px;min-height:112px}
.r-dabo{width:clamp(66px,19vw,92px)}
.r-dabo .dabo{width:100%;height:auto;filter:drop-shadow(0 6px 8px rgba(3,13,31,.5))}
.r-mid{align-self:center;display:grid;gap:6px;justify-items:center;min-width:0;text-align:center}
.r-foename{font:700 1rem/1.2 var(--f-display);letter-spacing:.03em;text-transform:uppercase;color:var(--text);text-shadow:0 1px 8px rgba(3,13,31,.8)}
.r-hp{display:flex;gap:4px;width:min(100%,220px)}
.r-hp i{flex:1;height:14px;background:linear-gradient(180deg,#ffb35c,var(--ora-600));clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);transition:opacity .3s,transform .3s}
.r-hp i.gone{opacity:.18;transform:scaleY(.6)}
.r-msg{min-height:2.6em;font:700 1.05rem/1.3 var(--f-display);color:var(--text);text-shadow:0 1px 8px rgba(3,13,31,.85)}
.r-msg.bad{color:#ffc4cc}.r-msg.good{color:#b8ffe6}
.r-foe{width:clamp(88px,27vw,124px)}
.r-foe .glitch{width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(3,13,31,.55))}
.r-foe.hit .glitch{animation:shakeX .4s,hitFlash .4s}
.r-foe.dead .glitch{animation:foeDie .7s ease-in forwards}
.r-foe.boss{width:clamp(110px,34vw,156px)}
@keyframes hitFlash{0%,100%{filter:drop-shadow(0 6px 10px rgba(3,13,31,.55))}40%{filter:brightness(2.4) drop-shadow(0 0 16px #fff)}}
@keyframes foeDie{to{opacity:0;transform:scale(.2) translateY(30px)}}
.r-card{display:grid;gap:8px;justify-items:center;padding:12px 12px 12px;text-align:center}
.r-card .k-tier{min-height:30px;padding:.1rem .9rem}
.r-play{position:relative;min-height:calc(var(--u) * 2.3)}
.gem-field{position:relative;width:100%;height:calc(var(--u) * 2.3)}
.bridge + .gem-field{height:calc(var(--u) * 1.95);margin-top:8px}
.shot{position:fixed;left:0;top:0;z-index:75;width:30px;height:30px;margin:-15px 0 0 -15px;color:var(--gold);pointer-events:none}
.shot svg{width:100%;height:100%;fill:currentColor;filter:drop-shadow(0 0 8px #ffd166)}

/* roda sandi */
.lock{--k:1;position:relative;display:grid;justify-items:center;gap:10px;max-width:420px;margin:4px auto 0;padding:10px 14px 14px}
.lock__wheels{display:flex;justify-content:center;align-items:flex-end;gap:14px}
.wheel{display:grid;justify-items:center;gap:2px}
.wheel__btn{display:grid;place-items:center;width:56px;height:48px;color:var(--sky-300);transition:transform var(--t-fast) var(--ease-spring),color var(--t-fast)}
.wheel__btn .ic{width:30px;height:30px}
.wheel__btn:hover{color:#fff}.wheel__btn:active{transform:scale(.85)}
.wheel__win{display:grid;place-items:center;overflow:hidden;font:700 calc(3.1rem * var(--k)) / 1 var(--f-display);color:var(--text-ink)}
.wheel__win span{display:block}
.wheel__win span.roll{animation:rollIn .18s var(--ease-out)}
.wheel--o .wheel__win{width:calc(84px * var(--k));height:calc(98px * var(--k));background:linear-gradient(180deg,#ffd6a3,var(--ora-500));clip-path:var(--hex)}
.wheel--t .wheel__win{width:calc(78px * var(--k));height:calc(94px * var(--k));background:linear-gradient(180deg,#d6f2ff,var(--sky-400));clip-path:polygon(14% 0,86% 0,100% 100%,0 100%)}
.wheel--h .wheel__win{width:calc(72px * var(--k));height:calc(90px * var(--k));background:linear-gradient(180deg,#dbe8ff,#5a9bff);border-radius:50%}
.wheel__lbl{font:500 1rem/1.1 var(--f-body);color:var(--text-dim)}
.lock.is-bad .wheel__win{animation:shakeX .45s}
.lock.is-open .wheel__win{background:linear-gradient(180deg,#b8ffe6,var(--mint))}
@keyframes rollIn{from{transform:translateY(-70%);opacity:0}to{transform:none;opacity:1}}

/* bar jembatan (soal "kurang berapa lagi") */
.bridge{position:relative;display:grid;gap:6px;max-width:460px;margin:2px auto 0;padding:12px 10px 8px}
.bridge__total{display:flex;align-items:center;justify-content:center;gap:8px;font:700 1.15rem/1 var(--f-display);color:var(--text)}
.bridge__total b{font-size:1.6rem;color:#fff}
.bridge__bar{display:flex;gap:4px;height:62px}
.bridge__seg{display:grid;place-items:center;min-width:64px;font:700 1.7rem/1 var(--f-display);color:var(--text-ink);transition:flex .4s var(--ease-out),background .3s}
.bridge__seg.a{background:linear-gradient(180deg,var(--sky-200),var(--sky-400));clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%)}
.bridge__seg.q{background:rgba(255,164,61,.2);color:var(--ora-300);border:2px dashed var(--ora-400);border-radius:10px;animation:qpulse 1.6s ease-in-out infinite}
.bridge__seg.q.is-filled{background:linear-gradient(180deg,var(--ora-200),var(--ora-500));color:var(--text-ink);border-style:solid;animation:none}
.bridge__rail{height:6px;background:repeating-linear-gradient(90deg,var(--sky-300) 0 14px,transparent 14px 20px);opacity:.7}

/* timbangan */
.scale{position:relative;height:clamp(250px,40vh,300px);max-width:520px;margin:0 auto}
.scale__beam{position:absolute;left:8%;right:8%;top:46px;height:14px;background:linear-gradient(180deg,#d6f2ff,var(--sky-500));border-radius:7px;box-shadow:0 0 14px rgba(76,195,255,.55);transition:transform .6s var(--ease-spring)}
.scale__post{position:absolute;left:50%;top:52px;bottom:0;width:20px;margin-left:-10px;background:linear-gradient(90deg,#08224a,#2a64a8 40%,#a8e2ff 50%,#2a64a8 60%,#08224a);box-shadow:0 0 0 1px rgba(143,216,255,.5)}
.scale__base{position:absolute;left:50%;bottom:0;width:130px;height:18px;margin-left:-65px;background:linear-gradient(180deg,#2a64a8,#0b2a52);clip-path:polygon(12% 0,88% 0,100% 100%,0 100%)}
.scale__hub{position:absolute;left:50%;top:40px;width:34px;height:34px;margin-left:-17px;background:var(--ora-400);clip-path:var(--hex);box-shadow:0 0 12px var(--ora-400)}
.pan{position:absolute;top:58px;display:grid;justify-items:center;width:clamp(112px,34%,156px);transform:translateX(-50%);transition:transform .6s var(--ease-spring);padding:0}
.pan--l{left:20%}.pan--r{left:80%}
.pan__chain{display:block;width:84%;height:40px;background:
  linear-gradient(to top right,transparent calc(50% - 1px),rgba(191,231,255,.85) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)) left bottom/50% 100% no-repeat,
  linear-gradient(to top left,transparent calc(50% - 1px),rgba(191,231,255,.85) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)) right bottom/50% 100% no-repeat}
.pan__dish{display:grid;place-items:center;gap:2px;width:100%;padding:12px 6px 14px;font:700 1.5rem/1.1 var(--f-display);color:var(--text-ink);background:linear-gradient(180deg,var(--sky-200),var(--sky-400));clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.pan--r .pan__dish{background:linear-gradient(180deg,var(--ora-200),var(--ora-500));clip-path:polygon(0 0,100% 0,100% 38%,86% 100%,14% 100%,0 38%)}
.pan__dish small{font:700 1.15rem/1 var(--f-display);color:#06306a;min-height:1.1em}
.pan--r .pan__dish small{color:#6a2e00}
.pan:hover .pan__dish{filter:brightness(1.08)}
.pan.is-right .pan__dish{background:linear-gradient(180deg,#b8ffe6,var(--mint))}
.pan.is-wrong .pan__dish{background:linear-gradient(180deg,#ffc4cc,var(--coral))}
.scale__eq{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:2}
.eqbtn{display:grid;place-items:center;min-width:92px;min-height:60px;padding:.4rem 1.2rem;font:700 1.1rem/1 var(--f-display);color:var(--text-ink);background:linear-gradient(180deg,var(--ora-300),var(--ora-500));clip-path:var(--hex);transition:transform var(--t-fast) var(--ease-spring)}
.eqbtn:hover{transform:scale(1.06)}.eqbtn:active{transform:scale(.94)}
.eqbtn.is-right{background:linear-gradient(180deg,#b8ffe6,var(--mint))}.eqbtn.is-wrong{background:linear-gradient(180deg,#ffc4cc,var(--coral))}

/* urutan kristal */
.sorter{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;width:100%;max-width:520px;margin:0 auto}
.slots{display:flex;justify-content:center;align-items:center;gap:8px}
.slot{display:grid;place-items:center;flex:1 1 0;min-width:0;max-width:130px;min-height:74px;border:2px dashed rgba(143,216,255,.55);border-radius:14px;font:700 1rem/1.2 var(--f-display);color:var(--sky-300);background:rgba(4,18,42,.4)}
.slot.has{border-style:solid;border-color:var(--ora-400);background:rgba(255,138,31,.12)}
.slot__n{font-size:1rem;opacity:.9}
.slots-arrow{font:700 1rem var(--f-display);color:var(--text-dim);text-align:center}
.gems{--gw:clamp(84px,calc((100vw - 52px) / 3.15),118px);position:relative;min-height:calc(var(--u) * 1.4);display:flex;justify-content:center;align-items:center;gap:8px}
.gem{position:relative;display:grid;place-items:center;padding:0;transition:transform var(--t-fast) var(--ease-spring),opacity .2s}
.gem:hover{transform:scale(1.06)}.gem:active{transform:scale(.94)}
.gem.used{opacity:.25;pointer-events:none}
.gem--hex{width:var(--gw);height:calc(var(--gw) * .92)}.gem--circle{width:calc(var(--gw) * .96);height:calc(var(--gw) * .96)}.gem--trap{width:calc(var(--gw) * 1.04);height:calc(var(--gw) * .84)}
.gem svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 5px 8px rgba(3,13,31,.5)) drop-shadow(0 0 10px rgba(76,195,255,.35))}
.gem__t{position:relative;font:700 clamp(1.05rem,4.4vw,1.2rem)/1.1 var(--f-display);color:var(--text-ink);text-align:center;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.slot .gem{width:96px;height:80px}
.slot .gem__t{font-size:1.05rem}
.slot .gem--circle{width:84px;height:84px}
.sorter.is-bad .slots{animation:shakeX .45s}
.reveal{font:700 1rem/1.1 var(--f-display);color:var(--mint)}

/* =====================================================================
   12. LAYAR CERITA, HADIAH, KALAH
   ===================================================================== */
.story{display:grid;gap:12px;width:min(100%,30rem);padding:20px 20px 20px;text-align:center}
.story__art{display:flex;justify-content:center;align-items:flex-end;gap:10px;min-height:150px}
.story__art .dabo{width:clamp(88px,26vw,128px);height:auto}
.story__art .glitch{width:clamp(88px,26vw,130px);height:auto}
.story__art .crystal-svg{width:clamp(100px,30vw,140px);height:auto}
.story h2{font:700 1.5rem/1.15 var(--f-display);color:#fff}
.story__zone{font:700 1rem/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ora-300)}
.story p{font-size:1.1rem;line-height:1.42;color:var(--text)}
.story__btns{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;margin-top:4px}
.story__dots{display:flex;justify-content:center;gap:8px}
.story__dots i{width:12px;height:12px;background:#2a5a93;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.story__dots i.on{background:var(--ora-400)}
.reward{display:grid;gap:10px;width:min(100%,28rem);padding:20px 20px 20px;text-align:center}
.reward .crystal-svg{animation:crystalIn .8s var(--ease-spring)}

/* =====================================================================
   C. MESIN SOAL — membuat soal, pengecoh yang masuk akal, petunjuk
   ===================================================================== */
const PTS = { base: 10, hint: 6, second: 5, streakStep: 2, streakMax: 5 };

const fillStory = (tpl, v) => tpl.replace(/\{(\w)\}/g, (_, k) => v[k]);
const tierLabel = (t) => `Tahap ${t} · ${TIER[t].name}`;
/* visual bantu muncul otomatis di tahap awal; makin tinggi tahap, makin "tanpa alat bantu" */
const aidShown = (tier, age, force) => force === 'on' || (age === 'young' ? tier <= 4 : tier <= 3);

/* pool soal: tidak mengulang soal yang sama sebelum seluruh tahap terpakai */
const makePool = () => {
  const used = {};
  return {
    take(tier, n = 1) {
      const all = BANK[tier];
      const seen = (used[tier] = used[tier] || new Set());
      let free = all.map((_, i) => i).filter((i) => !seen.has(i));
      if (free.length < n) { seen.clear(); free = all.map((_, i) => i); }
      const chosen = shuffle(free).slice(0, n);
      chosen.forEach((i) => seen.add(i));
      return chosen.map((i) => all[i]);
    }
  };
};
const missBag = () => { let bag = []; return () => { if (!bag.length) bag = shuffle(MISS.map((_, i) => i)); return bag.pop(); }; };

/* ---------- pembuat soal ---------- */
const addProblem = (tier, item, ui, age, force) => {
  const [a, b, tpl] = item;
  return { kind: 'add', ui: ui || 'pilih', tier, a, b, ans: a + b, story: fillStory(tpl, { a, b }), aid: aidShown(tier, age, force) };
};

/* "a + ? = c" — angka yang diketahui kadang angka pertama, kadang kedua */
const missProblem = (tier, item, nextTpl) => {
  const [a, b] = item;
  const flip = Math.random() < 0.5;
  const known = flip ? b : a, unknown = flip ? a : b, c = a + b;
  return { kind: 'missing', ui: 'jembatan', tier, a: known, b: unknown, c, ans: unknown, story: fillStory(MISS[nextTpl()], { a: known, c }), aid: false };
};

/* timbangan: bandingkan dua jumlah. Kadang sama (tukar tempat / pindah sepuluh) */
const compareProblem = (tier, pool, minDiff) => {
  const [a, b] = pool.take(tier, 1)[0];
  const sx = a + b;
  let x = [a, b], y = null;
  if (Math.random() < 0.22) {
    const maxK = Math.min(b - 1, 10, 99 - a);
    if (a !== b && Math.random() < 0.5) y = [b, a];
    else if (maxK >= 1) { const k = 1 + rand(maxK); y = [a + k, b - k]; }
    else y = [b, a];
  } else {
    let tries = 0, o;
    do { o = pool.take(tier, 1)[0]; tries++; } while (Math.abs(o[0] + o[1] - sx) < minDiff && tries < 10);
    y = [o[0], o[1]];
    if (Math.abs(y[0] + y[1] - sx) < minDiff) y = [a + 1, b + minDiff];
  }
  if (Math.random() < 0.5) [x, y] = [y, x];
  const sa = x[0] + x[1], sb = y[0] + y[1];
  return { kind: 'compare', ui: 'timbang', tier, x, y, sx: sa, sy: sb, ans: sa === sb ? 'EQ' : (sa > sb ? 'L' : 'R'), story: pick(CMP_PROMPT), aid: false };
};

/* urutkan tiga jumlah dari terkecil ke terbesar */
const orderProblem = (tier, pool, minDiff) => {
  let items, sums, tries = 0, good = false;
  do {
    items = pool.take(tier, 3).map(([a, b]) => ({ a, b, s: a + b }));
    sums = items.map((i) => i.s).sort((p, q) => p - q);
    good = sums[1] - sums[0] >= minDiff && sums[2] - sums[1] >= minDiff;
    tries++;
  } while (!good && tries < 12);
  if (!good) { /* jaga-jaga: paksa selisih agar urutan tidak ambigu */
    items.sort((p, q) => p.s - q.s);
    items[1].b += Math.max(0, items[0].s + minDiff - items[1].s);
    items[1].s = items[1].a + items[1].b;
    items[2].b += Math.max(0, items[1].s + minDiff - items[2].s);
    items[2].s = items[2].a + items[2].b;
    items = shuffle(items);
  }
  const order = items.map((it, i) => i).sort((p, q) => items[p].s - items[q].s);
  return { kind: 'order', ui: 'urut', tier, items, order, story: pick(ORDER_PROMPT), aid: false };
};

/* ---------- pilihan jawaban: pengecoh meniru kesalahan nyata anak ---------- */
const makeOptions = (p, count) => {
  const ans = p.ans;
  const lim = p.tier <= 2 ? 6 : 999;
  const okv = (v) => Number.isInteger(v) && v >= 0 && v <= 999 && v !== ans && Math.abs(v - ans) <= (p.tier <= 2 ? lim : 999);
  const near = shuffle([ans + 1, ans - 1, ans + 2, ans - 2]).filter(okv);
  let slips = [];
  if (p.kind === 'add') {
    const carry = (p.a % 10) + (p.b % 10) >= 10;
    slips = [carry ? ans - 10 : ans + 10, ans + 10, ans - 10, Math.abs(p.a - p.b), Math.max(p.a, p.b),
      (p.a % 10) + (p.b % 10) + (p.a - (p.a % 10)) + (p.b - (p.b % 10)) + 1];
  } else if (p.kind === 'missing') {
    slips = [p.c + p.a, p.c, p.a, ans + 10, ans - 10];
  }
  slips = shuffle(slips.filter(okv));
  const chosen = [];
  const push = (v) => { if (v !== undefined && !chosen.includes(v) && chosen.length < count - 1) chosen.push(v); };
  push(near[0]); push(slips[0]); push(near[1]); push(slips[1]); push(near[2]); push(slips[2]);
  let guard = 0;
  while (chosen.length < count - 1 && guard++ < 60) {
    const v = ans + (rand(2) ? 1 : -1) * (1 + rand(p.tier <= 2 ? 5 : 14));
    if (okv(v)) push(v);
  }
  return shuffle([ans, ...chosen]);
};

/* ---------- petunjuk bertahap (tanpa membocorkan jawaban akhir) ---------- */
const T10 = (n) => n - (n % 10), O1 = (n) => n % 10;
const hintFor = (p) => {
  if (p.kind === 'missing') {
    const a = p.a, c = p.c;
    if (c - a <= 12) return `Hitung maju dari <b class="hl-t">${a}</b> sampai <b class="hl-o">${c}</b>. Berapa langkahnya?`;
    const next = a % 10 === 0 ? a + 10 : T10(a) + 10;
    return `Naik dulu ke puluhan terdekat: ${a} → <b class="hl-t">${next}</b> butuh ${next - a}. Sisanya dari ${next} sampai <b class="hl-o">${c}</b>.`;
  }
  if (p.kind !== 'add') return '';
  const { a, b } = p;
  const big = Math.max(a, b), small = Math.min(a, b);
  if (a < 10 && b < 10) {
    if (a + b > 10) { const need = 10 - big; return `Genapkan ke 10 dulu: ${big} + ${need} = 10. Sisa ${small - need} lagi → 10 + ${small - need} = ?`; }
    return `Mulai dari ${big}, lalu hitung maju ${small} langkah.`;
  }
  const tens = T10(a) + T10(b), ones = O1(a) + O1(b);
  if (ones === 0) return `<b class="hl-t">${T10(a) / 10} puluh</b> digabung <b class="hl-t">${T10(b) / 10} puluh</b>. Jadi berapa puluh?`;
  let h = '';
  if (T10(a) && T10(b)) h += `<b class="hl-t">Puluhan: ${T10(a)} + ${T10(b)} = ${tens}</b>. `;
  else if (tens) h += `<b class="hl-t">Puluhan: ${tens}</b>. `;
  h += `<b class="hl-o">Satuan: ${O1(a)} + ${O1(b)} = ${ones}</b>. Terakhir ${tens} + ${ones} = ?`;
  return h;
};

/* ---------- sesi & ronde ---------- */
const buildHitung = (age) => {
  const pool = makePool();
  const list = [];
  HITUNG_MIX[age].forEach(([tier, n]) => pool.take(tier, n).forEach((it) => list.push(addProblem(tier, it, 'pilih', age))));
  return list;
};

const buildRounds = (age, doorIdx, pool, nextTpl) => PLAN[age][doorIdx].map(([ui, tier, force]) => {
  const gap = age === 'young' ? 3 : 2;
  if (ui === 'jembatan') return missProblem(tier, pool.take(tier, 1)[0], nextTpl);
  if (ui === 'timbang') return compareProblem(tier, pool, gap + 1);
  if (ui === 'urut') return orderProblem(tier, pool, gap + 1);
  return addProblem(tier, pool.take(tier, 1)[0], ui, age, force);
});

      <path d="M20 29.5h8M24 25.5v8" stroke="#8fd8ff" stroke-width="2.4" stroke-linecap="round"/><path d="M33 27.5h8M33 31.5h8" stroke="#ffa43d" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="19" cy="47" r="4" fill="#4cc3ff"/><circle cx="32" cy="47" r="4" fill="#ffa43d"/><circle cx="45" cy="47" r="4" fill="#4cc3ff"/>
      <path d="M26 58h12" stroke="#4cc3ff" stroke-width="2.4" stroke-linecap="round"/></svg>`;
  },
  iconDoor() {
    return `<svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="26" fill="url(#rGlow)" opacity=".7"/>
      <path d="M12 60V28a20 20 0 0 1 40 0v32z" fill="url(#gNavy)" stroke="#ffa43d" stroke-width="2"/>
      <path d="M18 60V29a14 14 0 0 1 28 0v31z" fill="url(#gOra)"/><path d="M32 15v45" stroke="#7a3500" stroke-width="1.6"/>
      <path d="M32 3l3 6.4 7 .9-5.1 4.8 1.3 6.9-6.2-3.4-6.2 3.4 1.3-6.9L22 10.3l7-.9z" fill="#ffd166" transform="translate(0 -1) scale(1 1)"/>
      <circle cx="39" cy="40" r="2" fill="#fff1d6"/></svg>`;
  },

  /* ---------- bola / kristal jawaban ---------- */
  orb(shape, color, facets) {
    const s = SHAPES[shape];
    return `<svg class="orb__svg" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="url(#${ORB_FILL[color % 4]})" stroke="rgba(255,255,255,.7)" stroke-width="1.6">${s.path}</g>
      <g clip-path="url(#${s.clip})"><ellipse cx="34" cy="24" rx="22" ry="10" fill="#fff" opacity=".34"/>${facets ? `<g fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="1.4">${s.facets}</g>` : ''}</g>
    </svg>`;
  },

  /* ---------- visual bantu: titik → kotak sepuluh → blok puluhan/satuan (memudar di tahap tinggi) ---------- */
  aid(p) {
    const { a, b } = p;
    if (p.tier === 1) return ART.dots(a, b);
    if (p.tier === 2) return ART.tenFrames(a, b);
    return ART.blocks(a, b);
  },
  dots(a, b) {
    const n = a + b, w = n * 24 + 38;
    let s = '';
    for (let i = 0; i < n; i++) {
      const x = i * 24 + (i >= a ? 36 : 0) + 2, c = i < a ? '#4cc3ff' : '#ffa43d', d = i < a ? '#0b84d6' : '#e56d00';
      s += `<path d="M${x + 11} 3l10 15-10 15-10-15z" fill="${c}" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/><path d="M${x + 11} 3l10 15h-20z" fill="#fff" opacity=".35"/><path d="M${x + 11} 33l-10-15h20z" fill="${d}" opacity=".5"/>`;
    }
    s += `<path d="M${a * 24 + 18} 11v14M${a * 24 + 11} 18h14" stroke="#eaf6ff" stroke-width="2.6" stroke-linecap="round"/>`;
    return `<svg class="aid-svg" viewBox="0 0 ${w} 36" role="img" aria-label="${a} kristal biru dan ${b} kristal oranye">${s}</svg>`;
  },
  tenFrames(a, b) {
    let s = '', idx = 0;
    for (let f = 0; f < 2; f++) {
      const ox = f * 150 + 4;
      s += `<rect x="${ox}" y="2" width="140" height="58" rx="4" fill="rgba(4,18,42,.55)" stroke="#8fd8ff" stroke-opacity=".75"/>`;
      for (let i = 0; i < 10; i++) {
        const cx = ox + 14 + (i % 5) * 27, cy = 18 + Math.floor(i / 5) * 26;
        const on = idx < a + b, col = idx < a ? '#4cc3ff' : '#ffa43d';
        s += on ? `<circle cx="${cx}" cy="${cy}" r="10" fill="${col}" stroke="#fff" stroke-opacity=".7"/><circle cx="${cx - 3}" cy="${cy - 3.5}" r="3" fill="#fff" opacity=".5"/>` : `<circle cx="${cx}" cy="${cy}" r="10" fill="none" stroke="#8fd8ff" stroke-opacity=".35" stroke-dasharray="2 3"/>`;
        idx++;
      }
    }
    return `<svg class="aid-svg" viewBox="0 0 298 62" role="img" aria-label="${a} bulatan biru dan ${b} bulatan oranye di dua kotak sepuluh">${s}</svg>`;
  },
  blocks(a, b) {
    const grp = (n, x0, fill, seg) => {
      const t = Math.floor(n / 10), o = n % 10;
      let g = '', x = x0;
      for (let i = 0; i < t; i++) {
        g += `<rect x="${x}" y="2" width="9" height="56" rx="1.5" fill="${fill}" stroke="#fff" stroke-opacity=".6" stroke-width=".8"/>`;
        for (let k = 1; k < 10; k++) g += `<line x1="${x}" y1="${2 + k * 5.6}" x2="${x + 9}" y2="${2 + k * 5.6}" stroke="${seg}" stroke-width=".8"/>`;
        x += 12;
      }
      if (o) {
        if (t) x += 4;
        const rows = Math.ceil(o / 3);
        for (let i = 0; i < o; i++) g += `<rect x="${x + (i % 3) * 12}" y="${60 - rows * 12 + Math.floor(i / 3) * 12}" width="10" height="10" rx="1.5" fill="${fill}" stroke="#fff" stroke-opacity=".7" stroke-width=".8"/>`;
        x += Math.min(o, 3) * 12;
      }
      return { g, w: x - x0 };
    };
    const A = grp(a, 2, '#4cc3ff', '#0b6fc2'), gap = 30;
    const B = grp(b, 2 + A.w + gap, '#ffa43d', '#d95f00');
    const total = 2 + A.w + gap + B.w + 2;
    const plus = `<path d="M${2 + A.w + gap / 2} 22v16M${2 + A.w + gap / 2 - 8} 30h16" stroke="#eaf6ff" stroke-width="3" stroke-linecap="round"/>`;
    return `<svg class="aid-svg" viewBox="0 0 ${Math.max(total, 120)} 62" role="img" aria-label="${Math.floor(a / 10)} batang puluhan dan ${a % 10} kubus untuk ${a}, ditambah ${Math.floor(b / 10)} batang puluhan dan ${b % 10} kubus untuk ${b}">${A.g}${plus}${B.g}</svg>`;
  },

  /* ---------- pintu lorong ---------- */
  door() {
    return `<svg class="door__svg" viewBox="0 0 100 128" aria-hidden="true">
      <path class="dr-frame" d="M6 126V50a44 44 0 0 1 88 0v76z"/>
      <path class="dr-void" d="M14 126V51a36 36 0 0 1 72 0v75z"/>
      <circle class="dr-light" cx="50" cy="84" r="46" fill="url(#rGlow)"/>
      <g clip-path="url(#cpDoor)"><g class="dr-leaves">
        <path class="dr-leaf dr-leaf-l" d="M14 126V51a36 36 0 0 1 36-36v111z"/><path class="dr-leaf dr-leaf-r" d="M50 15a36 36 0 0 1 36 36v75H50z"/>
        <path class="dr-seam" d="M50 15v111"/>
      </g></g>
      <g class="dr-lock" fill="#8fd8ff"><rect x="38" y="76" width="24" height="19" rx="3.5"/><path d="M42 76v-5a8 8 0 0 1 16 0v5" fill="none" stroke="#8fd8ff" stroke-width="3.6"/><circle cx="50" cy="85" r="2.6" fill="#0a2347"/></g>
    </svg>`;
  },
  /* lencana zona: segi enam bermedali emas/perak/perunggu */
  badge(zone, level) {
    const cols = { 3: ['#fff1c2', '#ffc93a', '#c98200'], 2: ['#f2f8ff', '#b9d3ee', '#6f93b8'], 1: ['#ffe2c4', '#e08a4a', '#9b4d14'], 0: ['#34527c', '#223c63', '#14284a'] }[level];
    const icons = [
      '<circle cx="40" cy="42" r="5"/><circle cx="52" cy="42" r="5"/><circle cx="46" cy="52" r="5"/>',
      '<rect x="30" y="38" width="32" height="16" rx="2" fill="none" stroke="#04122a" stroke-width="3"/><circle cx="38" cy="46" r="3.4"/><circle cx="46" cy="46" r="3.4"/><circle cx="54" cy="46" r="3.4"/>',
      '<rect x="34" y="34" width="7" height="24"/><rect x="45" y="34" width="7" height="24"/><rect x="56" y="48" width="8" height="10"/>',
      '<path d="M32 54a8 8 0 0 1 4-15 11 11 0 0 1 21-1 8 8 0 0 1 3 16z"/>',
      '<path d="M46 32l5 10 11 1.5-8 7.7 2 11-10-5.4-10 5.4 2-11-8-7.7L41 42z"/>'
    ];
    return `<svg class="badge-svg" viewBox="0 0 92 100" aria-hidden="true">
      <polygon points="23,4 69,4 90,50 69,96 23,96 2,50" fill="${cols[2]}"/><polygon points="25,10 67,10 85,50 67,90 25,90 7,50" fill="url(#bg${level})"/>
      <defs><linearGradient id="bg${level}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${cols[0]}"/><stop offset="1" stop-color="${cols[1]}"/></linearGradient></defs>
      <g fill="${level ? '#04122a' : '#5a77a3'}" opacity="${level ? '.85' : '.7'}">${icons[zone]}</g></svg>`;
  },
  crystalBig() {
    return `<svg class="crystal-svg" viewBox="0 0 100 120" aria-hidden="true">
      <circle cx="50" cy="60" r="52" fill="url(#rGlow)"/>
      <polygon points="50,6 84,36 50,114 16,36" fill="url(#gSkyD)" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/>
      <polygon points="50,6 84,36 50,48 16,36" fill="#c4ebff" opacity=".8"/><polygon points="16,36 50,48 50,114" fill="#0b6fc2" opacity=".6"/>
      <polygon points="50,6 62,36 50,114" fill="#ffa43d" opacity=".35"/></svg>`;

};

/* ---------- efek: ledakan bintang, poin melayang ---------- */
const burst = (x, y, { n = 10, spread = 120, colors } = {}) => {
  const fx = $('#fx');
  const cols = colors || ['var(--gold)', 'var(--ora-300)', 'var(--sky-300)', '#fff'];
  const count = reduceMotion() ? Math.min(n, 4) : n;
  const ring = mk('span', 'fring'); ring.style.cssText = `left:${x}px;top:${y}px;--c:var(--gold)`; fx.appendChild(ring); setTimeout(() => ring.remove(), 700);
  for (let i = 0; i < count; i++) {
    const s = mk('span', 'bstar', ic('star'));
    const ang = (i / count) * Math.PI * 2 + Math.random() * 0.7;
    const dist = spread * (0.55 + Math.random() * 0.65);
    s.style.cssText = `left:${x}px;top:${y}px;--dx:${(Math.cos(ang) * dist).toFixed(0)}px;--dy:${(Math.sin(ang) * dist - 24).toFixed(0)}px;--sz:${16 + rand(16)}px;--c:${pick(cols)};animation-delay:${rand(70)}ms`;
    fx.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
};
const floatText = (x, y, text, bad) => {
  const t = mk('span', 'fpop' + (bad ? ' fpop--bad' : ''), text);
  t.style.cssText = `left:${x}px;top:${y}px;transform:translateX(-50%)`;
  $('#fx').appendChild(t);
  setTimeout(() => t.remove(), 1100);
};
const centerOf = (node) => { const r = node.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };

/* ---------- HUD: rel kemajuan & skor ---------- */
const makeRail = (prefix, total) => {
  const rail = $('#' + prefix + '-rail'), dots = $('#' + prefix + '-dots'), fill = $('#' + prefix + '-fill');
  dots.innerHTML = '<i class="rail__dot"></i>'.repeat(total);
  rail.setAttribute('aria-valuemax', total);
  return {
    set(done, now) {
      Array.from(dots.children).forEach((d, i) => { d.classList.toggle('is-done', i < done); d.classList.toggle('is-now', i === now); });
      const frac = total > 1 ? clamp(Math.min(now, total - 1) / (total - 1), 0, 1) : 0;
      fill.style.width = `calc((100% - 14px) * ${frac.toFixed(4)})`;
      rail.setAttribute('aria-valuenow', done);
    }
  };
};
const setScore = (id, value, bump = true) => {
  const n = $('#' + id); n.textContent = value;
  if (bump) { n.classList.remove('bump'); void n.offsetWidth; n.classList.add('bump'); }
};
