   ===================================================================== */
/* posisi tiap bola (persen medan bola). Bentuk & warna melekat pada posisi, bukan pada jawaban — jadi tidak membocorkan jawaban. */
const ORB_SLOTS = {
  tall: [
    { x: 17, y: 27, s: 0.92, shape: 'hex', color: 0 },
    { x: 41, y: 72, s: 1.12, shape: 'circle', color: 1 },
    { x: 64, y: 25, s: 1.0, shape: 'tri', color: 3 },
    { x: 85, y: 69, s: 1.06, shape: 'trap', color: 2 }
  ],
  wide: [
    { x: 24, y: 17, s: 0.95, shape: 'hex', color: 0 },
    { x: 72, y: 34, s: 1.12, shape: 'circle', color: 1 },
    { x: 28, y: 63, s: 1.02, shape: 'tri', color: 3 },
    { x: 76, y: 85, s: 1.0, shape: 'trap', color: 2 }
  ]
};
const ORB_FS = { circle: 0.4, hex: 0.37, trap: 0.35, tri: 0.3 };

const exprHTML = (p) => (p.kind === 'missing'
  ? `<span class="n a">${p.a}</span><span class="op">+</span><span class="n q">?</span><span class="op">=</span><span class="n c">${p.c}</span>`
  : `<span class="n a">${p.a}</span><span class="op">+</span><span class="n b">${p.b}</span><span class="op">=</span><span class="n q">?</span>`);
const exprSpeech = (p) => (p.kind === 'missing' ? `${p.a} ditambah berapa sama dengan ${p.c}?` : `${p.a} ditambah ${p.b} sama dengan berapa?`);

/* visual bantu bawaan atau tombol petunjuk (dipakai Hitung & ruang Quest) */
const mountAid = (host, p, onHint) => {
  host.innerHTML = '';
  host.classList.remove('k-aid--hint');
  if (p.kind === 'compare' || p.kind === 'order') return;
  if (p.aid && p.kind === 'add') { host.innerHTML = ART.aid(p); return; }
  const btn = mk('button', 'hint-btn', `${ic('bulb')}<span>Petunjuk</span>`);
  btn.type = 'button'; btn.setAttribute('aria-label', 'Petunjuk');
  host.classList.add('k-aid--hint');
  btn.addEventListener('click', () => {
    Sound.play('tap'); if (onHint) onHint();
    host.classList.remove('k-aid--hint');
    const vis = p.kind === 'add' && p.tier <= 5 ? ART.aid(p) : '';
    host.innerHTML = `<div class="hint-box">${vis}<p class="hint-text">${hintFor(p)}</p></div>`;
  });
  host.appendChild(btn);
};

const orbEl = (slot, i, v, facets) => {
  const b = mk('button', `orb orb--${slot.shape}`);
  b.type = 'button'; b.dataset.v = v; b.dataset.i = i;
  const fs = ORB_FS[slot.shape] * (String(v).length >= 3 ? 0.82 : 1);
  b.style.cssText = `--x:${slot.x}%;--y:${slot.y}%;--s:${slot.s};--fs:${fs.toFixed(3)}`;
  b.setAttribute('aria-label', `Jawaban ${v}`);
  b.innerHTML = `<span class="orb__body">${ART.orb(slot.shape, slot.color, facets)}<span class="orb__num">${v}</span></span>`;
  return b;
};

const Hitung = {
  list: [], i: 0, score: 0, streak: 0, log: [], locked: true, hinted: false, rail: null, retry: false, ro: null, sig: '', token: 0,

  start(retryList) {
    this.token++;
    this.retry = Array.isArray(retryList);
    this.list = this.retry ? retryList.map((p) => ({ ...p })) : buildHitung(S.age);
    this.i = 0; this.score = 0; this.streak = 0; this.log = []; this.locked = true;
    this.rail = makeRail('h', this.list.length);
    setScore('h-score', 0, false);
    go('hitung');
    this.observe();
    this.render();
    if (!this.retry) requestAnimationFrame(() => toast('Ketuk bola jawaban yang benar!', 3400, $('#kalku')));
  },
  hasProgress() { return this.log.length > 0 && this.i < this.list.length; },
  abort() { this.token++; },
  observe() {
    if (this.ro || !window.ResizeObserver) return;
    this.ro = new ResizeObserver(() => { if (!screens.hitung.hidden) this.layout(); });
    this.ro.observe($('#h-stage'));
  },
  setMood(m) { $('#kalku').dataset.mood = m; },

  render() {
    const p = this.list[this.i], n = this.list.length;
    this.locked = false; this.hinted = false;
    $('#h-count').textContent = `${this.i + 1}/${n}`;
    this.rail.set(this.i, this.i);
    $('#h-tier').textContent = tierLabel(p.tier);
    $('#h-story').textContent = p.story;
    const ex = $('#h-expr');
    ex.innerHTML = exprHTML(p);
    ex.setAttribute('aria-label', exprSpeech(p));
    mountAid($('#h-aid'), p, () => { this.hinted = true; });
    this.setMood('idle');
    const field = $('#h-orbs');
    field.classList.remove('leaving');
    field.innerHTML = '';
    const slots = isWide() ? ORB_SLOTS.wide : ORB_SLOTS.tall;
    makeOptions(p, 4).forEach((v, i) => field.appendChild(orbEl(slots[i], i, v)));
    announce(`Soal ${this.i + 1} dari ${n}. ${p.story} ${exprSpeech(p)}`);
    requestAnimationFrame(() => this.pipes(true));
  },

  /* menyesuaikan posisi bola bila orientasi berubah, lalu menggambar ulang saluran */
  layout() {
    const slots = isWide() ? ORB_SLOTS.wide : ORB_SLOTS.tall;
    $$('.orb', $('#h-orbs')).forEach((o, i) => {
      const s = slots[i]; if (!s) return;
      o.style.setProperty('--x', s.x + '%'); o.style.setProperty('--y', s.y + '%'); o.style.setProperty('--s', s.s);
    });
    this.pipes(false);
  },

  /* saluran bening dari mulut Kalku ke tiap bola; bola meluncur sepanjang saluran */
  pipes(animate) {
    const stage = $('#h-stage'), svg = $('#h-pipes');
    const sr = stage.getBoundingClientRect();
    if (!sr.width || screens.hitung.hidden) return;
    const rel = (n) => { const r = n.getBoundingClientRect(); return { x: r.left + r.width / 2 - sr.left, y: r.top + r.height / 2 - sr.top }; };
    const wide = isWide(), key = wide ? 'y' : 'x';
    const outs = $$('.outlet', $('#h-mouth')).map(rel).sort((p, q) => p[key] - q[key]);
    const orbs = $$('.orb', $('#h-orbs')).map((n) => ({ n, ...rel(n) })).sort((p, q) => p[key] - q[key]);
    const sig = [Math.round(sr.width), Math.round(sr.height), wide, ...outs.map((o) => Math.round(o.x) + ':' + Math.round(o.y)), ...orbs.map((o) => Math.round(o.x) + ':' + Math.round(o.y))].join('|');
    if (!animate && sig === this.sig) return;
    this.sig = sig;
    stage.classList.toggle('static-pipes', !animate);
    svg.setAttribute('viewBox', `0 0 ${sr.width.toFixed(1)} ${sr.height.toFixed(1)}`);
    svg.innerHTML = orbs.map((b, i) => {
      const o = outs[i] || outs[outs.length - 1];
      const k = Math.max(36, Math.abs(wide ? b.x - o.x : b.y - o.y) * 0.5);
      const d = wide ? `M${o.x} ${o.y}C${o.x + k} ${o.y} ${b.x - k} ${b.y} ${b.x} ${b.y}` : `M${o.x} ${o.y}C${o.x} ${o.y + k} ${b.x} ${b.y - k} ${b.x} ${b.y}`;
      return `<g><path class="pipe-edge" pathLength="1" d="${d}"/><path class="pipe-body" pathLength="1" d="${d}"/><path class="pipe-flow" d="${d}"/></g>`;
    }).join('');
    if (animate && !reduceMotion() && orbs[0] && orbs[0].n.firstElementChild.animate) {
      const bodies = $$('.pipe-body', svg);
      orbs.forEach((b, i) => {
        const path = bodies[i]; if (!path) return;
        const L = path.getTotalLength(), frames = [], N = 9;
        for (let s = 0; s <= N; s++) {
          const t = s / N, pt = path.getPointAtLength(L * t);
          frames.push({ offset: t, opacity: t < 0.05 ? 0 : 1, transform: `translate(${(pt.x - b.x).toFixed(1)}px,${(pt.y - b.y).toFixed(1)}px) scale(${(0.3 + 0.7 * t).toFixed(3)})` });
        }
        b.n.firstElementChild.animate(frames, { duration: 640, delay: 120 + i * 95, easing: 'cubic-bezier(.3,.75,.35,1)', fill: 'backwards' });
      });
    }
  },

  async pick(btn) {
    if (this.locked) return;
    this.locked = true;
    const tk = this.token;
    const p = this.list[this.i];
    const v = Number(btn.dataset.v), right = v === p.ans;
    const pos = centerOf(btn), orbs = $$('.orb', $('#h-orbs'));
    orbs.forEach((o) => { if (o !== btn) o.classList.add('is-dim'); });
    btn.classList.add(right ? 'is-right' : 'is-wrong');
    btn.querySelector('.orb__body').insertAdjacentHTML('beforeend', `<span class="orb__mark">${ic(right ? 'check' : 'cross')}</span>`);
    if (!right) {
      const good = orbs.find((o) => Number(o.dataset.v) === p.ans);
      if (good) { good.classList.remove('is-dim'); good.classList.add('is-answer'); good.querySelector('.orb__body').insertAdjacentHTML('beforeend', `<span class="orb__mark">${ic('check')}</span>`); }
    }
    const q = $('.q', $('#h-expr'));
    if (q) { q.textContent = p.ans; q.classList.add(right ? 'is-solved' : 'is-miss'); }
    let pts = 0;
    if (right) {
      pts = (this.hinted ? PTS.hint : PTS.base) + Math.min(this.streak, PTS.streakMax) * PTS.streakStep;
      this.streak++; this.score += pts;
      setScore('h-score', this.score);
      Sound.play('ok'); Sound.play('star');
      burst(pos.x, pos.y, { n: 12 });
      floatText(pos.x, pos.y - 34, `+${pts}`);
      if (this.streak >= 3) { const k = centerOf($('#h-expr')); floatText(k.x, k.y - 50, `Beruntun ×${this.streak}`); }
      this.setMood('happy');
    } else {
      this.streak = 0;
      Sound.play('bad');
      floatText(pos.x, pos.y - 34, 'Hampir!', true);
      this.setMood('sad');
    }
    this.log.push({ p, picked: v, right, hinted: this.hinted, pts });
    announce(right ? `Benar! ${p.ans}. Dapat ${pts} poin.` : `Belum tepat. Jawaban yang benar ${p.ans}.`);
    await wait(440);                                   // total jeda ke soal berikutnya = 600 ms
    if (tk !== this.token) return;
    $('#h-orbs').classList.add('leaving');
    await wait(160);
    if (tk !== this.token) return;
    this.i++;
    if (this.i >= this.list.length) this.finish(); else this.render();
  },

  finish() {
    const total = this.list.length, right = this.log.filter((l) => l.right).length;
    const byTier = {};
    this.log.forEach((l) => { const d = (byTier[l.p.tier] = byTier[l.p.tier] || { right: 0, total: 0 }); d.total++; if (l.right) d.right++; });
    this.rail.set(total, total - 1);
    showResult({
      mode: 'hitung', retry: this.retry, score: this.score, right, wrong: total - right, total, byTier,
      hinted: this.log.filter((l) => l.hinted).length, missed: this.log.filter((l) => !l.right).map((l) => l.p)
    });
  }
};

const countUp = (node, to, ms = 900) => {
  if (reduceMotion() || to === 0) { node.textContent = to; return; }
  const t0 = performance.now();
  const tick = (t) => { const k = Math.min(1, (t - t0) / ms); node.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(tick); };

};

/* =====================================================================
   H. ADVENTURE QUEST RPG — lorong pintu menaik + ruang tantangan
   ===================================================================== */
const DN = DOORS.length;                                   // 10 pintu
const STEP = 196, TOP_PAD = 340, BOT_PAD = 250;           // geometri lorong (px)
const CORR_H = TOP_PAD + (DN - 1) * STEP + BOT_PAD;
const doorY = (i) => TOP_PAD + (DN - 1 - i) * STEP;       // pintu 1 paling bawah; jalur naik ke puncak
const padX = (i) => (i % 2 === 0 ? 38 : 62);              // jalur zig-zag (persen lebar)
const doorX = (i) => (i % 2 === 0 ? 15 : 85);             // pintu kiri-kanan bergantian
const START = { x: 50, y: CORR_H - 96 };
const CORE_Y = 168;
const zoneDoors = (z) => DOORS.map((d, i) => (d.zone === z ? i : -1)).filter((i) => i >= 0);
const hexPts = (cx, cy, r) => Array.from({ length: 6 }, (_, k) => { const a = (Math.PI / 3) * k; return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`; }).join(' ');
const starRow = (n, total = 3) => Array.from({ length: total }, (_, k) => ic('star', 'ic' + (k < n ? '' : ' off'))).join('');

/* ---------- LORONG ---------- */
const Quest = {
  age: 'young', pool: null, nextTpl: null, cur: 0, done: [], stars: [], score: 0, firstTry: 0, retries: 0,
  busy: false, walking: false, queued: -1, pts: [], litSeg: -1, rail: null, run: 0,

  start() {
    const run = ++this.run;
    this.age = S.age;
    this.pool = makePool(); this.nextTpl = missBag();
    this.cur = 0; this.done = Array(DN).fill(false); this.stars = Array(DN).fill(0);
    this.score = 0; this.firstTry = 0; this.retries = 0; this.busy = true; this.walking = true; this.queued = -1; this.litSeg = -1;
    this.rail = makeRail('q', DN);
    setScore('q-score', 0, false);
    this.build();
    go('quest');
    this.refresh();
    const sc = $('#q-scroll');
    sc.scrollTop = sc.scrollHeight;
    this.showProlog().then(async () => {
      if (run !== this.run) return;
      await this.walk(0);
      if (run !== this.run) return;
      this.busy = false; this.walking = false;
      this.litSeg = 0; this.refresh();
      this.tip('Ketuk pintu yang menyala!');
      this.flushQueued();
    });
  },
  hasProgress() { return this.done.some(Boolean); },
  abort() { this.run++; Room.token++; this.busy = false; this.walking = false; this.queued = -1; Overlay.hide(); },

  build() {
    const c = $('#q-corridor');
    c.style.height = CORR_H + 'px';
    const pts = this.pts = [START, ...DOORS.map((_, i) => ({ x: padX(i), y: doorY(i) }))];
    const seg = (a, b) => { const m = (b.y - a.y) / 2; return `M${a.x} ${a.y}C${a.x} ${(a.y + m).toFixed(1)} ${b.x} ${(b.y - m).toFixed(1)} ${b.x} ${b.y}`; };
    let segs = '';
    for (let i = 0; i < pts.length - 1; i++) segs += `<path class="q-seg" data-i="${i}" d="${seg(pts[i], pts[i + 1])}"/>`;
    segs += `<path class="q-seg" data-i="${DN}" d="${seg(pts[DN], { x: 50, y: CORE_Y + 70 })}"/>`;

    const zones = ZONES.map((z, k) => {
      const first = zoneDoors(k)[0];
      return `<span class="q-zone" style="--y:${doorY(first) + STEP / 2 + 4}px"><span>Zona ${k + 1}</span><b>${z.name}</b></span>`;
    }).join('');
    const pads = [`<span class="pad pad--start" style="--x:${START.x}%;--y:${START.y}px"></span>`, ...DOORS.map((_, i) => `<span class="pad" data-i="${i}" style="--x:${padX(i)}%;--y:${doorY(i)}px"></span>`)].join('');
    const doors = DOORS.map((d, i) => `
      <button class="door is-locked ${i % 2 === 0 ? 'side-l' : 'side-r'}" type="button" data-i="${i}" style="--x:${doorX(i)}%;--y:${doorY(i) + 40}px">
        <span class="door__go">Ketuk!</span>
        <span class="door__art">${ART.door()}<span class="door__num">${i + 1}</span><span class="door__stars"></span></span>
        <span class="door__plaque">${d.name}</span>
      </button>`).join('');
    const socks = Array.from({ length: DN }, (_, k) => { const a = (k / DN) * Math.PI * 2 - Math.PI / 2; return `<polygon class="sock" data-k="${k}" points="${hexPts(100 + Math.cos(a) * 82, 100 + Math.sin(a) * 82, 12)}"/>`; }).join('');
    const core = `<div class="q-core" style="--y:${CORE_Y}px"><svg viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="98" fill="url(#rGlow)" opacity=".7"/><circle cx="100" cy="100" r="82" fill="none" stroke="#fff" stroke-opacity=".4" stroke-dasharray="3 7"/>
        ${socks}
        <g class="core-crystal" id="core-crystal"><polygon points="100,46 132,80 100,158 68,80" fill="url(#gSkyD)" stroke="#fff" stroke-opacity=".85" stroke-width="2"/><polygon points="100,46 132,80 100,92 68,80" fill="#c4ebff" opacity=".85"/><polygon points="100,46 112,80 100,158" fill="#ffa43d" opacity=".4"/></g></svg></div>`;

    c.innerHTML = `<div class="q-wall l"></div><div class="q-wall r"></div><div class="q-floor"></div>
      <svg class="q-path" viewBox="0 0 100 ${CORR_H}" preserveAspectRatio="none" aria-hidden="true">${segs}</svg>
      ${core}${zones}${pads}${doors}
      <div class="q-avatar" id="q-avatar" style="--x:${START.x}%;--y:${START.y}px"><span id="q-dabo"></span></div>`;
    setDabo($('#q-dabo'), 'idle', 'happy');
  },

  state(i) { return this.done[i] ? 'done' : i === this.cur ? 'open' : 'locked'; },
  refresh() {
    const c = $('#q-corridor');
    $$('.door', c).forEach((d) => {
      const i = Number(d.dataset.i), st = this.state(i);
      d.classList.remove('is-locked', 'is-open', 'is-done'); d.classList.add('is-' + st);
      d.querySelector('.door__stars').innerHTML = st === 'done' ? starRow(this.stars[i]) : '';
      d.setAttribute('aria-label', `Pintu ${i + 1}: ${DOORS[i].name}. ` + (st === 'done' ? `Selesai, ${this.stars[i]} bintang.` : st === 'open' ? 'Terbuka. Ketuk untuk masuk.' : 'Terkunci.'));
    });
    $$('.pad[data-i]', c).forEach((p) => { const st = this.state(Number(p.dataset.i)); p.classList.toggle('is-open', st === 'open'); p.classList.toggle('is-done', st === 'done'); });
    $$('.q-seg', c).forEach((s) => s.classList.toggle('is-done', Number(s.dataset.i) <= this.litSeg));
    $$('.sock', c).forEach((s) => s.classList.toggle('is-lit', this.done[Number(s.dataset.k)]));
    $('#core-crystal', c).classList.toggle('is-whole', this.done.every(Boolean));
    const doneN = this.done.filter(Boolean).length;
    $('#q-count').textContent = `Pintu ${Math.min(this.cur + 1, DN)}/${DN}`;
    this.rail.set(doneN, Math.min(this.cur, DN - 1));
  },

  tip(msg) {
    const t = $('#q-tip'); t.textContent = msg; t.hidden = false;
    clearTimeout(this.tipT); this.tipT = setTimeout(() => { t.hidden = true; }, 4200);
  },

  /* avatar berjalan sepanjang jalur dari pad ke-from menuju pad berikutnya */
  walk(from) {
    return new Promise((resolve) => {
      const seg = $(`.q-seg[data-i="${from}"]`, $('#q-corridor')), av = $('#q-avatar'), sc = $('#q-scroll');
      const L = seg.getTotalLength(), dur = reduceMotion() ? 1 : 1500, t0 = performance.now();
      let lastX = null, lastStep = 0;
      av.classList.add('walking');
      const follow = (y) => { sc.scrollTop = clamp(y - sc.clientHeight * 0.62, 0, sc.scrollHeight - sc.clientHeight); };
      const frame = (t) => {
        const k = clamp((t - t0) / dur, 0, 1), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        const p = seg.getPointAtLength(L * e);
        av.style.setProperty('--x', p.x.toFixed(2) + '%'); av.style.setProperty('--y', p.y.toFixed(1) + 'px');
        if (lastX !== null && Math.abs(p.x - lastX) > 0.02) av.classList.toggle('flip', p.x < lastX);
        lastX = p.x;
        follow(p.y);
        if (t - lastStep > 190) { Sound.play('step'); lastStep = t; }
        if (k < 1) requestAnimationFrame(frame); else { av.classList.remove('walking', 'flip'); resolve(); }
      };
      requestAnimationFrame(frame);
    });
  },

  flushQueued() { const q = this.queued; this.queued = -1; if (q === this.cur && !this.busy) this.enter(q); },

  async enter(i) {
    if (this.walking && i === this.cur) { this.queued = i; return; }   // Dabo masih berjalan: masuk otomatis begitu tiba
    if (this.busy) return;
    const door = $(`.door[data-i="${i}"]`, $('#q-corridor'));
    if (i > this.cur) { door.classList.remove('shake'); void door.offsetWidth; door.classList.add('shake'); Sound.play('bad'); toast('Pintu masih terkunci. Selesaikan pintu yang menyala dulu ya!'); return; }
    if (this.done[i]) { toast('Pintu ini sudah selesai. Lanjut ke pintu yang menyala!'); return; }
    this.busy = true;
    const run = this.run;
    $('#q-tip').hidden = true;
    Sound.play('door');
    door.classList.add('opening');
    await wait(reduceMotion() ? 50 : 650);
    if (run !== this.run) return;
    const flash = mk('div', 'q-flash'); document.body.appendChild(flash);
    await wait(reduceMotion() ? 50 : 480);
    if (run !== this.run) { flash.remove(); return; }
    Room.open(i);
    door.classList.remove('opening');
    flash.style.transition = 'opacity .45s'; flash.style.opacity = 0;
    setTimeout(() => flash.remove(), 500);
    this.busy = false;
  },

  /* dipanggil setelah hadiah diklaim: buka pintu berikutnya & jalan maju */
  async after(i, stars) {
    this.done[i] = true; this.stars[i] = stars;
    if (i === DN - 1) { this.litSeg = DN; this.finish(); return; }
    this.cur = i + 1; this.busy = true; this.walking = true; this.queued = -1;
    const run = this.run;

    const sc = $('#q-scroll'); sc.scrollTop = clamp(doorY(i) - sc.clientHeight * 0.62, 0, sc.scrollHeight - sc.clientHeight);

    if (run !== this.run) return;

    this.flushQueued();
  },

  finish() {
    const starTotal = this.stars.reduce((s, v) => s + v, 0);
    const zoneLevel = ZONES.map((_, z) => { const ids = zoneDoors(z); const a = ids.reduce((s, i) => s + this.stars[i], 0) / ids.length; return a >= 2.6 ? 3 : a >= 1.8 ? 2 : 1; });
    const rounds = PLAN[this.age].reduce((s, d) => s + d.length, 0);
    showResult({ mode: 'quest', score: this.score, right: this.firstTry, wrong: this.retries, total: rounds, avg: starTotal / DN, starTotal, starMax: DN * 3, zoneLevel });
  },

  showProlog() {
    const slides = [
      { art: ART.crystalBig(), title: 'Menara Kristal', text: 'Di puncak Menara Kristal, Inti Angka menjaga semua angka di daveWorld.' },
      { art: ART.glitch(false), title: 'Kabut Glitch!', text: 'Tiba-tiba Kabut Glitch menyelinap dan memecah Inti menjadi 10 pecahan. Angka-angka pun hilang!' },

        $('[data-n]', root).addEventListener('click', () => { Sound.play('tap'); if (last) { Overlay.hide(); resolve(); } else { k++; render(); } });
        const sk = $('[data-skip]', root); if (sk) sk.addEventListener('click', () => { Sound.play('tap'); Overlay.hide(); resolve(); });
      };
      render();
    });
  }
};

$('#q-corridor').addEventListener('click', (e) => { const d = e.target.closest('.door'); if (d) Quest.enter(Number(d.dataset.i)); });

/* ---------- RUANG TANTANGAN ---------- */
const GEM_SLOTS = {
  3: [{ x: 20, y: 34, s: 1.0, shape: 'hex', color: 0 }, { x: 50, y: 72, s: 1.1, shape: 'circle', color: 1 }, { x: 80, y: 32, s: 0.98, shape: 'tri', color: 3 }],

};
const dropIn = (nodes) => nodes.forEach((n, i) => {

const Room = {
  i: 0, door: null, rounds: [], idx: 0, energy: 3, attempts: 0, roundWrong: 0, pts: 0, locked: true, hinted: false, rail: null, snap: null, lockVals: null, lockP: null, token: 0,

  open(i) {

  renderEnergy(lost) {

    if (lost) { const e = $('#r-energy'); e.style.animation = 'none'; void e.offsetWidth; e.style.animation = 'shakeX .45s'; }
  },
  renderBattle() {

  intro() {

      <p class="story__zone">Zona ${d.zone + 1} · ${ZONES[d.zone].name}</p>

  renderRound() {

  /* --- bentuk 1 & 3: kristal pilihan (pilih) + jembatan --- */
  gemField(p, play) {

  uiGems(p, play) { this.gemField(p, play); },
  uiBridge(p, play) {

  pickGem(btn, p) {

      this.wrong(pos, p);

  /* --- bentuk 2: sandi pintu (roda angka, jawaban diketik sendiri — tanpa petunjuk pilihan) --- */
  uiLock(p, play) {
    const digits = p.ans >= 100 ? 3 : 2, names = ['satuan', 'puluhan', 'ratusan'], cls = ['o', 't', 'h'];

      <button class="wheel__btn" type="button" data-dir="-1" aria-label="Turunkan ${names[d]}">${ic('down')}</button>
      <span class="wheel__lbl">${names[d]}</span></div>`;
    play.innerHTML = `<div class="lock holo" id="lock"><div class="lock__wheels">${Array.from({ length: digits }, (_, k) => wheel(digits - 1 - k)).join('')}</div>
      <span class="glow"><button class="btn" id="lock-go" type="button">Buka Pintu!</button></span></div>`;
    play.onclick = (e) => {
      if (this.locked) return;
      const wb = e.target.closest('.wheel__btn');
      if (wb) { const d = Number(wb.closest('.wheel').dataset.d); this.setDigit(d, (this.lockVals[d] + Number(wb.dataset.dir) + 10) % 10); Sound.play('tap'); return; }

  setDigit(d, v) {

    sp.textContent = v; sp.classList.remove('roll'); void sp.offsetWidth; sp.classList.add('roll');
    win.setAttribute('aria-label', `${['satuan', 'puluhan', 'ratusan'][d]} ${v}`);
  },
  checkLock() {
    if (this.locked) return;
    const p = this.lockP, val = this.lockVals.reduce((s, v, d) => s + v * Math.pow(10, d), 0);
    const lock = $('#lock'), go = $('#lock-go'), pos = centerOf(go);
    if (val === p.ans) { lock.classList.add('is-open'); this.right(pos); }
    else {
      lock.classList.remove('is-bad'); void lock.offsetWidth; lock.classList.add('is-bad');
      go.textContent = 'Coba Lagi';
      this.wrong(pos, p);
    }
  },

  /* --- bentuk 4: timbangan raksasa --- */
  uiScale(p, play) {
    const pan = (side, e) => `<button class="pan pan--${side}" type="button" data-pick="${side === 'l' ? 'L' : 'R'}" aria-label="Sisi ${side === 'l' ? 'kiri' : 'kanan'}: ${e[0]} ditambah ${e[1]}"><span class="pan__chain"></span><span class="pan__dish">${e[0]} + ${e[1]}<small></small></span></button>`;
    play.innerHTML = `<div class="scale" id="scale"><div class="scale__post"></div><div class="scale__base"></div><div class="scale__beam" id="beam"></div><div class="scale__hub"></div>
      ${pan('l', p.x)}${pan('r', p.y)}<span class="scale__eq"><button class="eqbtn" type="button" data-pick="EQ">Sama</button></span></div>`;
    this.tilt(0);
    play.onclick = (e) => {
      const b = e.target.closest('[data-pick]'); if (!b || this.locked || b.disabled) return;
      const pick = b.dataset.pick, pos = centerOf(b);
      if (pick === p.ans) {
        b.classList.add('is-right');
        this.tilt(p.sx === p.sy ? 0 : p.sx > p.sy ? -9 : 9);
        const [l, r] = $$('.pan__dish small', play); l.textContent = '= ' + p.sx; r.textContent = '= ' + p.sy;
        this.right(pos);
      } else { b.classList.add('is-wrong'); b.disabled = true; this.wrong(pos, p); }
    };
  },
  tilt(deg) {
    const sc = $('#scale'); if (!sc) return;
    const W = sc.clientWidth, dy = Math.sin(deg * Math.PI / 180) * W * 0.3;
    $('#beam').style.transform = `rotate(${deg}deg)`;
    $('.pan--l', sc).style.transform = `translate(-50%,${(-dy).toFixed(1)}px)`;
    $('.pan--r', sc).style.transform = `translate(-50%,${dy.toFixed(1)}px)`;
  },

  /* --- bentuk 5: urutkan kristal dari hasil terkecil --- */
  uiSort(p, play) {
    const shapes = shuffle(['hex', 'circle', 'trap']);
    play.innerHTML = `<div class="sorter" id="sorter"><p class="slots-arrow">terkecil → terbesar</p>
      <div class="slots" id="slots">${[1, 2, 3].map((n) => `<div class="slot" data-n="${n}"><span class="slot__n">${n}</span></div>`).join('')}</div>
      <div class="gems" id="gems">${p.items.map((it, i) => `<button class="gem gem--${shapes[i]}" type="button" data-i="${i}" aria-label="${it.a} ditambah ${it.b}">${ART.orb(shapes[i], i, true)}<span class="gem__t">${it.a} + ${it.b}</span></button>`).join('')}</div></div>`;
    dropIn($$('.gem', play).map((g) => ({ firstElementChild: g })));
    play.onclick = (e) => {
      const g = e.target.closest('.gem'); if (!g || this.locked) return;
      const slots = $$('.slot', play), inSlot = g.parentNode.classList.contains('slot');
      Sound.play('tap');
      if (inSlot) { g.parentNode.classList.remove('has'); $('#gems').appendChild(g); return; }
      const free = slots.find((s) => !s.classList.contains('has'));
      if (!free) return;
      free.classList.add('has'); free.appendChild(g);
      if (slots.every((s) => s.classList.contains('has'))) this.checkSort(p, play);
    };
  },
  async checkSort(p, play) {
    const chosen = $$('.slot .gem', play).map((g) => Number(g.dataset.i));
    const sorter = $('#sorter'), pos = centerOf($('#slots'));
    if (chosen.every((v, k) => v === p.order[k])) {
      $$('.slot .gem', play).forEach((g) => { const it = p.items[Number(g.dataset.i)]; g.insertAdjacentHTML('beforeend', `<span class="gem__t reveal" style="position:absolute;bottom:-22px">= ${it.s}</span>`); });
      this.right(pos);
    } else {
      sorter.classList.remove('is-bad'); void sorter.offsetWidth; sorter.classList.add('is-bad');
      this.wrong(pos, p);
      this.locked = true;
      const tk = this.token;
      await wait(750);
      if (tk === this.token && this.energy > 0) {
        $$('.slot', play).forEach((s) => { s.classList.remove('has'); const g = $('.gem', s); if (g) $('#gems').appendChild(g); });
        this.locked = false;
      }
    }
  },

  /* --- hasil jawaban --- */
  async right(pos) {
    this.locked = true;
    const tk = this.token;
    const first = this.roundWrong === 0;
    const pts = first ? (this.hinted ? PTS.hint : PTS.base) : PTS.second;
    Quest.score += pts; this.pts += pts; if (first) Quest.firstTry++;
    setScore('r-score', Quest.score);
    Sound.play('ok'); Sound.play('star');
    burst(pos.x, pos.y, { n: 12 }); floatText(pos.x, pos.y - 34, `+${pts}`);
    this.msg('Tepat sekali!', 'good'); this.mood('cheer', 'happy');

    await this.attack();
    if (tk !== this.token) return;
    this.idx++;

    if (this.idx >= this.rounds.length) { await wait(350); if (tk === this.token) this.win(); }
    else { await wait(420); if (tk === this.token) this.renderRound(); }
  },
  wrong(pos, p) {
    if (this.energy <= 0) return;
    this.roundWrong++; this.attempts++; Quest.retries++; this.energy--;
    this.renderEnergy(true);
    Sound.play('bad'); floatText(pos.x, pos.y - 34, 'Belum tepat', true);
    this.mood('idle', 'sad');
    if (this.energy <= 0) { this.locked = true; this.msg('Energi habis…', 'bad'); const tk = this.token; setTimeout(() => { if (tk === this.token) this.lose(); }, 950); return; }
    this.msg('Belum tepat. Coba lagi ya!', 'bad');
    if ((p.kind === 'add' || p.kind === 'missing') && $('#r-aid') && this.roundWrong === 1) {
      const vis = p.kind === 'add' && p.tier <= 5 ? ART.aid(p) : '';
      $('#r-aid').innerHTML = `<div class="hint-box">${vis}<p class="hint-text">${hintFor(p)}</p></div>`;
    }
    setTimeout(() => { if (!this.locked || this.energy > 0) this.mood('idle', 'happy'); }, 1000);
  },

  /* serangan bintang: Dabo → Glitch */
  attack() {
    return new Promise((resolve) => {
      const from = centerOf($('#r-dabo')), foe = $('#r-foe'), to = centerOf(foe);
      const finish = () => {
        foe.classList.remove('hit'); void foe.offsetWidth; foe.classList.add('hit');
        const hp = $$('#r-hp i:not(.gone)'); if (hp.length) hp[hp.length - 1].classList.add('gone');
        Sound.play('zap'); burst(to.x, to.y, { n: 9, spread: 90 });
        setTimeout(resolve, 260);
      };
      const shot = mk('span', 'shot', ic('star')); document.body.appendChild(shot);
      if (reduceMotion() || !shot.animate) { shot.remove(); finish(); return; }
      Sound.play('whoosh');
      const a = shot.animate([{ transform: `translate(${from.x}px,${from.y}px) scale(.6)` }, { transform: `translate(${(from.x + to.x) / 2}px,${Math.min(from.y, to.y) - 70}px) scale(1.5)`, offset: 0.5 }, { transform: `translate(${to.x}px,${to.y}px) scale(.9)` }], { duration: 460, easing: 'ease-in-out', fill: 'forwards' });
      a.onfinish = () => { shot.remove(); finish(); };
    });
  },

  win() {
    this.locked = true;
    const stars = this.attempts === 0 ? 3 : this.attempts === 1 ? 2 : 1, d = this.door, boss = !!d.boss;
    $('#r-foe').classList.add('dead');
    Sound.play('win');
    const root = Overlay.show(`<div class="reward holo">
      <div class="story__art">${ART.crystalBig()}</div>
      <h2>${boss ? 'Inti Angka Utuh!' : `Pecahan Kristal #${this.i + 1}!`}</h2>
      <div class="reward__stars" role="img" aria-label="${stars} dari 3 bintang">${starRow(stars)}</div>
      <p>${d.outro}</p><p class="reward__pts">+${this.pts} poin</p>
      <div class="story__btns"><span class="glow"><button class="btn" type="button" data-claim data-autofocus>${boss ? 'Lihat Hasil' : 'Lanjut Mendaki'}</button></span></div></div>`);
    $$('.reward__stars .ic', root).forEach((s) => { s.style.width = '44px'; s.style.height = '44px'; });
    setTimeout(() => { const cs = $('.crystal-svg', root); if (cs) { const c = centerOf(cs); burst(c.x, c.y, { n: 14, spread: 130 }); } }, 350);
    $('[data-claim]', root).addEventListener('click', () => { Sound.play('tap'); Overlay.hide(); Quest.after(this.i, stars); });
  },
  lose() {
    Sound.play('lose');
    const root = Overlay.show(`<div class="reward reward--lose holo">
      <div class="story__art">${ART.dabo({ pose: 'idle', mood: 'sad' })}${ART.glitch(!!this.door.boss)}</div>
      <h2>Energi Dabo habis!</h2>
      <p>Tidak apa-apa, penjelajah hebat selalu mencoba lagi. Soalnya akan diacak ulang.</p>
      <div class="story__btns"><span class="glow"><button class="btn" type="button" data-retry data-autofocus>${ic('retry')}Coba Lagi</button></span><button class="btn-ghost" type="button" data-out>← Ke Lorong</button></div></div>`);
    Quest.score = this.snap.score; Quest.firstTry = this.snap.firstTry;
    setScore('r-score', Quest.score, false);
    $('[data-retry]', root).addEventListener('click', () => { Sound.play('tap'); Overlay.hide(); this.open(this.i); });
    $('[data-out]', root).addEventListener('click', () => { Sound.play('tap'); Overlay.hide(); go('quest'); setScore('q-score', Quest.score, false); });
  },
  async leave() {
    const inProgress = this.idx > 0 || this.energy < 3;
    if (inProgress && !(await confirmDialog({ title: 'Keluar dari pintu ini?', text: 'Tantangan di pintu ini akan diulang dari awal.', yes: 'Ya, keluar', no: 'Lanjut main' }))) return;
    this.token++;
    Quest.score = this.snap.score; Quest.firstTry = this.snap.firstTry;
    setScore('q-score', Quest.score, false);
    Sound.play('tap'); go('quest');
  }
};
$('.js-leave').addEventListener('click', () => Room.leave());
document.addEventListener('keydown', (e) => {
  if (currentScreen !== 'room' || !Overlay.root.hidden) return;
  if (Room.lockVals && $('#lock') && !Room.locked) {
    if (/^[0-9]$/.test(e.key)) { const n = Room.lockVals.length, cur = Room.lockVals.reduce((s, v, d) => s + v * Math.pow(10, d), 0); const nv = (cur * 10 + Number(e.key)) % Math.pow(10, n); for (let d = 0; d < n; d++) Room.setDigit(d, Math.floor(nv / Math.pow(10, d)) % 10); }
    else if (e.key === 'Backspace') { const n = Room.lockVals.length, cur = Room.lockVals.reduce((s, v, d) => s + v * Math.pow(10, d), 0), nv = Math.floor(cur / 10); for (let d = 0; d < n; d++) Room.setDigit(d, Math.floor(nv / Math.pow(10, d)) % 10); }
    else if (e.key === 'Enter') Room.checkLock();
  }
});

/* =====================================================================
   I. BOOT — layar welcome, menu, tombol umum
   ===================================================================== */
const setAge = (age, silent) => {
  S.age = age; store.set('age', age);
  $$('.age').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.age === age)));
  $('#w-note').textContent = '';
  setAgeChips();
  if (!silent) Sound.play('pick');
};
$$('.age').forEach((b) => b.addEventListener('click', () => setAge(b.dataset.age)));

$('#btn-start').addEventListener('click', () => {
  if (!S.age) {
    const grp = $('.w-pick');
    grp.classList.remove('nudge'); void grp.offsetWidth; grp.classList.add('nudge');
    $('#w-note').textContent = 'Pilih usiamu dulu ya, lalu tekan Mulai!';
    Sound.play('tap');
    return;
  }
  Sound.play('whoosh');
  showMenu();
});
$('.js-to-welcome').addEventListener('click', () => { Sound.play('tap'); go('welcome'); });
$$('.sign').forEach((s) => s.addEventListener('click', () => startMode(s.dataset.mode)));

/* "← Ganti Jenis Game" di dalam game: konfirmasi bila sudah ada kemajuan */
$$('.js-back').forEach((b) => b.addEventListener('click', async () => {
  const live = currentScreen === 'hitung' ? Hitung.hasProgress() : currentScreen === 'quest' ? Quest.hasProgress() : false;
  if (live && !(await confirmDialog({ title: 'Ganti jenis game?', text: 'Kemajuan permainan ini akan hilang.', yes: 'Ya, ganti', no: 'Lanjut main' }))) return;
  Sound.play('tap');
  Hitung.abort(); Quest.abort();
  showMenu();
}));

document.documentElement.lang = 'id';
injectArt();
renderSound();
if (S.age) setAge(S.age, true);
setAgeChips();
go('welcome');

})();
</script>
